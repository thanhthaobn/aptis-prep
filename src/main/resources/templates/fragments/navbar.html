<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <header class="site-header" th:fragment="navbar">
      <!-- WCAG AA Skip link -->
      <a href="#main-content" class="ap-skip-link">Bỏ qua điều hướng</a>

      <div class="container ap-container nav-wrap">
        <a class="brand" th:href="@{/}">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 19V7.5L12 4l7 3.5V19" />
              <path d="M8.5 10.5 12 12l3.5-1.5M12 12v8" />
            </svg>
          </span>
          <span>AptisPrep</span>
        </a>

        <!-- Hamburger toggle button cho màn hình di động (<680px) -->
        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-label="Mở menu điều hướng"
          aria-expanded="false"
          aria-controls="primaryNav"
        >
          <svg
            class="hamburger-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <nav class="nav-links" id="primaryNav" aria-label="Điều hướng chính">
          <a
            th:href="@{/}"
            th:classappend="${navSection == 'home'} ? 'active'"
            th:attr="aria-current=${navSection == 'home' ? 'page' : null}"
          >
            Trang chủ
          </a>
          <a
            sec:authorize="hasRole('STUDENT')"
            th:href="@{/student/dashboard}"
            th:classappend="${navSection == 'student'} ? 'active'"
            th:attr="aria-current=${navSection == 'student' ? 'page' : null}"
          >
            Học tập
          </a>
          <a
            sec:authorize="hasRole('ADMIN')"
            th:href="@{/admin/dashboard}"
            th:classappend="${navSection == 'admin'} ? 'active'"
            th:attr="aria-current=${navSection == 'admin' ? 'page' : null}"
          >
            Quản trị
          </a>
          <a
            sec:authorize="isAnonymous()"
            th:href="@{/login}"
            th:classappend="${navSection == 'login'} ? 'active'"
            th:attr="aria-current=${navSection == 'login' ? 'page' : null}"
          >
            Đăng nhập
          </a>
          <a
            sec:authorize="isAnonymous()"
            class="button button-small"
            th:href="@{/register}"
            th:classappend="${navSection == 'register'} ? 'active'"
            th:attr="aria-current=${navSection == 'register' ? 'page' : null}"
          >
            Đăng ký
          </a>
          <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="button button-secondary button-small" type="submit">Đăng xuất</button>
          </form>
        </nav>
      </div>

      <!-- Script điều khiển toggle mobile navbar thuần JS -->
      <script th:src="@{/js/navigation.js}" defer></script>
    </header>
  </body>
</html>
