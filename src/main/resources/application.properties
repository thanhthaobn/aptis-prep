spring.application.name=aptis-prep

server.port=8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false

# Keep explicit restart trigger while rebuilding the merged application.
spring.devtools.restart.trigger-file=.reloadtrigger

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=80MB
# Lesson editor: up to 20 questions plus teaching fields and file inputs.
server.tomcat.max-part-count=300

app.storage.upload-dir=uploads

app.ai.enabled=${GEMINI_ENABLED:false}
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.grading-model=${GEMINI_GRADING_MODEL:gemini-3.5-flash-lite}
app.demo.catalog-fallback=false

# Demo accounts are opt-in and require passwords from local configuration or environment variables.
app.demo-data.enabled=${APTIS_DEMO_DATA_ENABLED:false}
app.demo.admin-email=${APTIS_DEMO_ADMIN_EMAIL:admin@aptis.local}
app.demo.admin-password=${APTIS_DEMO_ADMIN_PASSWORD:}
app.demo.student-email=${APTIS_DEMO_STUDENT_EMAIL:student@aptis.local}
app.demo.student-password=${APTIS_DEMO_STUDENT_PASSWORD:}
