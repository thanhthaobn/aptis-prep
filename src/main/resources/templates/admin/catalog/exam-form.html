<!doctype html>
<!--/*@thymesVar id="form" type="com.aptisprep.dto.form.ExamForm"*/-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <form
      th:fragment="examForm"
      th:if="${catalog.key == 'exams'}"
      class="dashboard-panel catalog-preview-form"
      method="post"
      th:action="${editing ? '/admin/exams/' + entry.id + '/edit' : '/admin/exams'}"
    >
      <h2>Thông tin đề thi</h2>
      <p
        class="alert alert-danger"
        role="alert"
        th:if="${examError != null}"
        th:text="${examError}"
      ></p>
      <div class="field">
        <label>
          <input type="hidden" name="_demoOnly" value="on" />
          <input
            type="checkbox"
            id="demoOnly"
            name="demoOnly"
            value="true"
            th:checked="${examForm.demoOnly}"
          />
          Chỉ dùng cho demo/kiểm thử — không cho học viên bắt đầu lượt mới
        </label>
      </div>
      <div class="field">
        <label for="title">Tên đề thi</label>
        <input id="title" name="title" th:value="${examForm.title}" maxlength="255" required />
      </div>
      <div class="field">
        <label for="description">Mô tả</label>
        <textarea
          id="description"
          name="description"
          th:text="${examForm.description}"
          rows="3"
        ></textarea>
      </div>
      <div class="catalog-form-grid">
        <div class="field">
          <label for="examType">Loại đề</label>
          <select id="examType" name="examType">
            <option value="PLACEMENT" th:selected="${examForm.examType == 'PLACEMENT'}">
              Kiểm tra đầu vào
            </option>
            <option value="PRACTICE" th:selected="${examForm.examType == 'PRACTICE'}">
              Luyện tập
            </option>
            <option value="CHECKPOINT" th:selected="${examForm.examType == 'CHECKPOINT'}">
              Kiểm tra cuối chặng
            </option>
            <option value="FULL_MOCK" th:selected="${examForm.examType == 'FULL_MOCK'}">
              Thi thử tổng hợp
            </option>
          </select>
        </div>
        <div class="field">
          <label for="targetLevel">Cấp độ mục tiêu</label>
          <select id="targetLevel" name="targetLevel">
            <option value="" th:selected="${examForm.targetLevel == null}">
              Không đặt (trừ Checkpoint)
            </option>
            <option
              th:each="item : ${levels}"
              th:value="${item}"
              th:text="${item}"
              th:selected="${examForm.targetLevel == item}"
            ></option>
          </select>
        </div>
        <div class="field">
          <label for="certificateId">Chứng chỉ</label>
          <select id="certificateId" name="certificateId">
            <option
              th:each="item : ${certificates}"
              th:value="${item.id}"
              th:text="${item.name}"
              th:selected="${examForm.certificateId == item.id}"
            ></option>
          </select>
        </div>
        <div class="field">
          <label for="scoringSchemeId">Bộ chấm điểm</label>
          <select id="scoringSchemeId" name="scoringSchemeId">
            <option value="" th:selected="${examForm.scoringSchemeId == null}">
              Không quy đổi CEFR (chỉ điểm raw)
            </option>
            <option
              th:each="item : ${schemes}"
              th:value="${item.id}"
              th:text="${item.name + ' — v' + item.version}"
              th:selected="${examForm.scoringSchemeId == item.id}"
              th:attr="data-exam-type=${item.examType},data-skill=${item.scopeSkill},data-certificate=${item.certificate.id}"
            ></option>
          </select>
        </div>
        <p class="muted">
          Tổng thời gian:
          <output id="exam-total-minutes">—</output>
          phút
        </p>
      </div>
      <section class="catalog-form-section">
        <div class="section-title-row"><h2>Sections và câu hỏi</h2></div>
        <p class="muted">
          Full Mock có thể gồm nhiều kỹ năng. Mỗi câu hỏi chỉ được đưa vào đúng một section.
        </p>
        <div id="exam-sections">
          <div
            class="exam-section-editor"
            th:each="section, sectionStat : ${examForm.sections}"
            th:with="sectionPath=${'sections[' + sectionStat.index + ']'}"
            th:attr="data-section-index=${sectionStat.index}"
          >
            <h3 class="exam-section-title">
              <span class="exam-section-number" th:text="${sectionStat.index + 1}">1</span>
              <span>Section</span>
            </h3>
            <div class="catalog-form-grid">
              <div class="field">
                <label th:for="${'sections-' + (sectionStat.index) + '-skill'}">
                  Kỹ năng section
                </label>
                <select
                  class="section-skill"
                  th:id="${'sections-' + (sectionStat.index) + '-skill'}"
                  th:name="${sectionPath + '.skill'}"
                >
                  <option
                    th:each="skillCode : ${skills}"
                    th:value="${skillCode}"
                    th:text="${skillCode}"
                    th:selected="${section.skill == skillCode}"
                  ></option>
                </select>
              </div>
              <div class="field">
                <label th:for="${'sections-' + (sectionStat.index) + '-durationMinutes'}">
                  Thời lượng section (phút)
                </label>
                <input
                  type="number"
                  class="section-duration"
                  min="1"
                  required
                  th:id="${'sections-' + (sectionStat.index) + '-durationMinutes'}"
                  th:name="${sectionPath + '.durationMinutes'}"
                  th:value="${section.durationMinutes}"
                />
              </div>
            </div>
            <input
              type="hidden"
              class="section-question-ids"
              th:name="${sectionPath + '.questionIds'}"
              th:value="${section.questionIds}"
            />
            <div class="catalog-checkbox section-question-picker">
              <label
                class="section-question-label"
                draggable="true"
                th:each="question : ${publishedQuestions}"
                th:attr="data-skill=${question.skill}"
                th:hidden="${question.skill != section.skill}"
              >
                <input
                  type="checkbox"
                  class="section-question"
                  th:attr="data-question-id=${question.id},data-section-index=${sectionStat.index},data-skill=${question.skill}"
                  th:checked="${section.questionIds != null and (',' + section.questionIds + ',').contains(',' + question.id + ',')}"
                />
                <span
                  th:text="${question.id + ' · ' + question.skill + ' · ' + question.content}"
                ></span>
              </label>
            </div>
          </div>
        </div>
        <div class="section-add-action">
          <button class="button button-secondary button-small" type="button" id="add-exam-section">
            Thêm section
          </button>
        </div>
      </section>
      <div class="page-actions">
        <button class="button" type="submit">Lưu đề thi</button>
        <a class="button button-secondary" th:href="@{/admin/exams}">Hủy</a>
      </div>
    </form>
  </body>
</html>
