<!doctype html>
<!--/*@thymesVar id="display" type="com.aptisprep.controller.DisplayFormatting"*/-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <div
      th:fragment="pathOverview(skill)"
      th:each="stage : ${stages}"
      th:if="${stage.skill == skill}"
      class="path-overview"
    >
      <dl class="path-summary">
        <div>
          <dt>Hiện tại</dt>
          <dd th:text="${stage.currentLevel != null ? stage.currentLevel : 'Chưa đánh giá'}"></dd>
        </div>
        <div>
          <dt>Đích chặng</dt>
          <dd th:text="${stage.targetLevel != null ? stage.targetLevel : 'Đã hoàn tất'}"></dd>
        </div>
        <div>
          <dt>Mục tiêu</dt>
          <dd>
            <span th:if="${stage.goalLevel != null}" th:text="${stage.goalLevel}"></span>
            <a
              th:if="${stage.goalLevel == null}"
              th:href="@{/student/goals}"
              aria-label="Đặt mục tiêu cá nhân"
            >
              Chưa đặt ↗
            </a>
          </dd>
        </div>
      </dl>
      <div th:replace="~{fragments/path-stage :: stageScale(${stage})}"></div>
      <p class="muted" th:if="${stage.status == 'NO_CONTENT'}">Chưa có bài học cho chặng này.</p>
    </div>
    <span th:fragment="pathLevelRange(skill)" class="explore-number stage-range">
      <span th:each="stage : ${stages}" th:if="${stage.skill == skill}">
        <span>Hiện tại:</span>
        <span th:text="${stage.currentLevel != null ? stage.currentLevel : 'Chưa đánh giá'}"></span>
        <span>· Mục tiêu:</span>
        <strong th:text="${stage.goalLevel != null ? stage.goalLevel : 'Chưa đặt'}"></strong>
      </span>
    </span>
    <section
      th:fragment="pathStage(skill)"
      class="stage-overview"
      aria-label="Trình độ và đích chặng"
    >
      <div th:replace="~{fragments/path-stage :: pathOverview(${skill})}"></div>
    </section>
    <ol
      th:fragment="stageScale(stage)"
      th:with="current=${stage.targetLevel},goal=${stage.goalLevel},scale=${display.learningLevels()}"
      class="stage-scale"
      aria-label="Thang chặng CEFR"
      th:style="${'--stage-progress:' + (stage.currentLevel == null ? 0 : scale.indexOf(stage.currentLevel) + 1)}"
    >
      <!-- Filled levels are assessed; the outlined step is the next learning destination. -->
      <li
        th:each="level, levelStat : ${scale}"
        th:classappend="${(level == current ? ' is-current' : '') + (level == goal ? ' is-goal' : '') + (stage.currentLevel != null and levelStat.index &lt;= scale.indexOf(stage.currentLevel) ? ' is-reached' : '')}"
        th:attr="aria-current=${level == current ? 'step' : null}"
      >
        <strong th:text="${level}"></strong>
        <small th:if="${level == current}">Đích chặng</small>
        <small th:if="${level == stage.currentLevel}">Hiện tại</small>
        <small class="stage-goal-label" th:if="${level == goal}">★ Mục tiêu</small>
      </li>
    </ol>
  </body>
</html>
