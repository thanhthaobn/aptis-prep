<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head(${set.title})}"></head>
  <body class="student-theme flashcard-page">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container ap-container app-shell">
      <div th:replace="~{fragments/student-sidebar :: studentSidebar('flashcards')}"></div>
      <main
        id="main-content"
        tabindex="-1"
        class="app-main flashcard-study"
        th:attr="data-set-id=${set.id},data-skill=${set.lesson!=null?set.lesson.skill:null}"
      >
        <a
          class="lesson-back"
          th:href="${set.lesson!=null?'/student/lessons/'+set.lesson.id:'/student/flashcards'}"
          th:text="${set.lesson!=null?'← Quay lại bài học':'← Quay lại bộ thẻ'}"
        ></a>
        <a
          class="set-lesson-source study-lesson-source"
          th:if="${set.lesson!=null}"
          th:href="@{/student/lessons/{id}(id=${set.lesson.id})}"
          ><small th:text="|${set.lesson.skill} · ${set.cefrLevel} · Bài học nguồn|"></small
          ><span th:text="|${set.lesson.title} ↗|"></span
        ></a>
        <header
          class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3"
        >
          <div>
            <p class="eyebrow">CHẾ ĐỘ HỌC</p>
            <h1 th:text="${set.title}"></h1>
            <p th:text="${set.description}"></p>
          </div>
          <span
            class="badge"
            th:classappend="${set.cefrLevel != null ? 'badge-cefr-' + #strings.toLowerCase(set.cefrLevel) : ''}"
            th:text="${set.cefrLevel}"
          ></span>
        </header>
        <div class="toolbar flashcard-options d-flex flex-wrap align-items-center gap-3">
          <label class="flashcard-toggle"
            ><input id="reverse" type="checkbox" /> Hiện nghĩa trước</label
          >
          <label class="flashcard-toggle"
            ><input id="unlearned" type="checkbox" /> Chỉ thẻ cần học lại</label
          >
          <button class="button button-secondary" id="shuffle" type="button">Trộn thẻ</button>
        </div>
        <div class="study-summary d-flex align-items-center justify-content-between gap-3">
          <p id="study-stats" role="status"></p>
          <span id="position" aria-live="polite"></span>
        </div>
        <section id="study-session">
          <div class="flashcard-stage" id="card-stage">
            <button
              type="button"
              class="flashcard-3d"
              id="flip"
              aria-label="Lật thẻ"
              aria-pressed="false"
            >
              <span class="flashcard-inner"
                ><span class="flashcard-side flashcard-front"
                  ><span class="face-label" id="front-label">THUẬT NGỮ</span
                  ><strong class="face-content" id="front-content"></strong
                  ><small>Bấm hoặc nhấn Space để lật</small></span
                ><span class="flashcard-side flashcard-back"
                  ><span class="face-label" id="back-label">ĐỊNH NGHĨA</span
                  ><strong class="face-content" id="back-content"></strong
                  ><small>Bấm để quay lại mặt trước</small></span
                ></span
              >
            </button>
          </div>
          <div class="actions flashcard-controls d-flex justify-content-center gap-3">
            <button type="button" class="button button-secondary" id="previous">← Thẻ trước</button
            ><button type="button" class="button button-secondary" id="next">Thẻ tiếp →</button>
          </div>
          <div
            class="actions flashcard-controls mastery-controls d-flex justify-content-center gap-3"
          >
            <button type="button" class="button button-secondary" id="learning">Cần học lại</button
            ><button type="button" class="button" id="mastered">Đã nhớ</button>
          </div>
          <p id="save-message" role="status" aria-live="polite"></p>
          <p class="keyboard-hint">Phím ← → để chuyển thẻ · Space để lật</p>
        </section>
        <section id="study-complete" class="study-complete dashboard-panel" hidden>
          <div
            th:replace="~{fragments/navi :: navi('celebrate', 'Navi chúc mừng bạn đã hoàn thành một lượt ôn tập')}"
          ></div>
          <p class="eyebrow">TỔNG KẾT LƯỢT HỌC</p>
          <h2>Bạn đã xem hết các thẻ</h2>
          <div class="flashcard-result-grid">
            <article class="flashcard-result is-mastered">
              <strong id="mastered-count">0</strong><span>Đã nhớ</span>
            </article>
            <article class="flashcard-result is-learning">
              <strong id="learning-count">0</strong><span>Cần học lại</span>
            </article>
          </div>
          <div id="learning-review" class="learning-review" hidden>
            <h3>Những từ cần học lại</h3>
            <ul id="learning-terms"></ul>
          </div>
          <div class="actions completion-actions">
            <button type="button" class="button" id="review-learning">Ôn lại từ chưa thuộc</button
            ><button type="button" class="button button-secondary" id="restart-all">
              Học lại tất cả</button
            ><a class="button button-secondary" th:href="@{/student/flashcards}"
              >Về danh sách bộ thẻ</a
            >
          </div>
        </section>
        <form
          id="csrf-holder"
          method="post"
          th:action="@{/student/flashcards/{id}/cards/0/state(id=${set.id})}"
          hidden
        ></form>
        <section id="study-data" hidden>
          <div th:each="card:${cards}" th:attr="data-id=${card.id()},data-state=${card.state()}">
            <span class="term" th:text="${card.term()}"></span
            ><span class="definition" th:text="${card.definition()}"></span>
          </div>
        </section>
        <details class="dashboard-panel dashboard-section term-overview">
          <summary>Xem toàn bộ thuật ngữ</summary>
          <dl class="term-list">
            <div th:each="card:${cards}">
              <dt th:text="${card.term()}"></dt>
              <dd th:text="${card.definition()}"></dd>
              <dd
                class="muted"
                th:if="${card.nextReviewAt != null}"
                th:text="|Ôn tiếp: ${#temporals.format(card.nextReviewAt,'dd/MM/yyyy HH:mm')}|"
              ></dd>
            </div>
          </dl>
        </details>
      </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/flashcard-study.js}" defer></script>
  </body>
</html>
