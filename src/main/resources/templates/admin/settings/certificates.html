<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Chứng chỉ')}"></head>
  <body class="admin-theme">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container ap-container app-shell">
      <div th:replace="~{fragments/admin-sidebar :: adminSidebar('certificates')}"></div>
      <main id="main-content" tabindex="-1" class="app-main admin-catalog admin-scoring-settings">
        <div th:replace="~{fragments/messages :: messages}"></div>
        <header class="page-header"><h1>Chứng chỉ</h1></header>
        <section id="certificates">
          <div class="section-title-row">
            <h2>Chứng chỉ</h2>
            <a class="button" th:href="@{/admin/certificates/create}">Thêm chứng chỉ</a>
          </div>
          <div class="table-wrap" th:if="${certificatePage.hasContent()}">
            <table class="data-table admin-responsive-table">
              <thead>
                <tr>
                  <th scope="col">Tên chứng chỉ</th>
                  <th scope="col">Mã</th>
                  <th scope="col">Trạng thái</th>
                  <th scope="col">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="certificate : ${certificatePage.content}">
                  <td data-label="Tên chứng chỉ" th:text="${certificate.name}"></td>
                  <td data-label="Mã" th:text="${certificate.code}"></td>
                  <td data-label="Trạng thái">
                    <span
                      class="scoring-status"
                      th:classappend="${certificate.status == 'ACTIVE'} ? 'is-active'"
                      th:text="${certificate.statusLabel}"
                    ></span>
                  </td>
                  <td data-label="Thao tác">
                    <div class="catalog-table-actions">
                      <a th:href="@{/admin/certificates/{id}(id=${certificate.id})}">
                        Xem chi tiết
                      </a>
                      <a th:href="@{/admin/certificates/{id}/edit(id=${certificate.id})}">
                        Chỉnh sửa
                      </a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div
            th:replace="~{fragments/student-pagination :: listPagination(${certificatePage.number}, ${certificatePage.totalPages}, ${certificatePage.totalElements}, @{/admin/certificates}, 'certificatePage')}"
          ></div>
          <div class="empty-box" th:unless="${certificatePage.hasContent()}">
            <div
              th:replace="~{fragments/navi :: navi('empty', 'Navi đang chờ chứng chỉ đầu tiên')}"
            ></div>
            <p>Chưa có chứng chỉ.</p>
          </div>
        </section>
      </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
