<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${set.title})}"></head><body class="student-theme flashcard-page"><div th:replace="~{fragments/navbar :: navbar}"></div><div class="container ap-container app-shell"><div th:replace="~{fragments/student-sidebar :: studentSidebar('flashcards')}"></div><main id="main-content" tabindex="-1" class="app-main flashcard-study" th:attr="data-set-id=${set.id}"><a class="lesson-back" th:href="@{/student/flashcards}">← Quay lại bộ thẻ</a><header class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3"><div><p class="eyebrow">CHẾ ĐỘ HỌC</p><h1 th:text="${set.title}"></h1><p th:text="${set.description}"></p></div><span class="badge" th:classappend="${set.cefrLevel != null ? 'badge-cefr-' + #strings.toLowerCase(set.cefrLevel) : ''}" th:text="${set.cefrLevel}"></span></header><div class="toolbar flashcard-options d-flex flex-wrap align-items-center gap-3"><label class="flashcard-toggle"><input id="reverse" type="checkbox"> Hiện nghĩa trước</label><label class="flashcard-toggle"><input id="unlearned" type="checkbox"> Chỉ từ đang học</label><button class="button button-secondary" id="shuffle" type="button">Trộn thẻ</button></div><div class="study-summary d-flex align-items-center justify-content-between gap-3"><p id="study-stats" role="status"></p><span id="position" aria-live="polite"></span></div><div class="flashcard-stage" id="card-stage"><button type="button" class="flashcard-3d" id="flip" aria-label="Lật thẻ" aria-pressed="false"><span class="flashcard-inner"><span class="flashcard-side flashcard-front"><span class="face-label" id="front-label">THUẬT NGỮ</span><strong class="face-content" id="front-content"></strong><small>Bấm hoặc nhấn Space để lật</small></span><span class="flashcard-side flashcard-back"><span class="face-label" id="back-label">ĐỊNH NGHĨA</span><strong class="face-content" id="back-content"></strong><small>Bấm để quay lại mặt trước</small></span></span></button></div><section id="study-complete" class="study-complete" hidden><div th:replace="~{fragments/navi :: navi('celebrate', 'Navi chúc mừng bạn đã hoàn thành bộ thẻ')}"></div><h2>Hoàn thành bộ thẻ</h2><p>Bạn đã đánh dấu nhớ toàn bộ thuật ngữ trong bộ này.</p><a class="button button-secondary" th:href="@{/student/flashcards}">Quay lại bộ thẻ</a></section><div class="actions flashcard-controls d-flex justify-content-center gap-3"><button type="button" class="button button-secondary" id="previous">← Thẻ trước</button><button type="button" class="button button-secondary" id="next">Thẻ tiếp →</button></div><div class="actions flashcard-controls mastery-controls d-flex justify-content-center gap-3"><button type="button" class="button button-secondary" id="learning">Cần học lại</button><button type="button" class="button" id="mastered">Đã nhớ</button></div><p id="save-message" role="status" aria-live="polite"></p><p class="keyboard-hint">Phím ← → để chuyển thẻ · Space để lật</p><form id="csrf-holder" method="post" th:action="@{/student/flashcards/{id}/cards/0/state(id=${set.id})}" hidden></form><section id="study-data" hidden><div th:each="card:${cards}" th:attr="data-id=${card.id()},data-state=${card.state()}"><span class="term" th:text="${card.term()}"></span><span class="definition" th:text="${card.definition()}"></span></div></section><details class="dashboard-panel dashboard-section term-overview"><summary>Xem toàn bộ thuật ngữ</summary><dl class="term-list"><div th:each="card:${cards}"><dt th:text="${card.term()}"></dt><dd th:text="${card.definition()}"></dd></div></dl></details></main></div><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/flashcard-study.js}" defer></script></body></html>
