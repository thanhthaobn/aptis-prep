<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Bài học')}"></head>
<body class="student-theme">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container ap-container app-shell">
    <div th:replace="~{fragments/student-sidebar :: studentSidebar('lessons')}"></div>
    <main id="main-content" tabindex="-1" class="app-main student-content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Tổng quan', @{/student/dashboard}, 'Bài học')}"></div>
        <header class="page-header"><div><p class="eyebrow">THƯ VIỆN HỌC TẬP</p><h1>Bài học theo kỹ năng</h1></div></header>
        <form class="toolbar" method="get" th:action="@{/student/lessons}">
            <div class="toolbar-search"><label for="q">Tìm kiếm</label><input id="q" name="q" th:value="${q}" maxlength="255" placeholder="Tên bài học hoặc chủ đề"></div>
            <div><label for="skill">Kỹ năng</label><select id="skill" name="skill"><option value="">Tất cả</option><option th:each="v:${skills}" th:value="${v}" th:text="${v}" th:selected="${selectedSkill==v}"></option></select></div>
            <div><label for="level">CEFR</label><select id="level" name="level"><option value="">Tất cả</option><option th:each="v:${levels}" th:value="${v}" th:text="${v}" th:selected="${selectedLevel==v}"></option></select></div>
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <section class="lesson-library-tree" th:if="${!#lists.isEmpty(lessons)}" aria-label="Cây bài học theo kỹ năng và cấp độ">
            <p class="library-count" th:text="|${#lists.size(lessons)} bài học · Chọn kỹ năng và cấp độ để khám phá|"></p>
            <details class="library-skill" th:each="branch:${lessonTree}" th:attr="data-skill=${branch.skill}">
                <summary><span class="library-skill-name" th:text="${branch.skill}"></span><span class="library-count" th:text="|${branch.count} bài học|"></span></summary>
                <div class="library-levels">
                    <details class="library-level" th:each="tier:${branch.levels}">
                        <summary><span class="library-level-badge" th:text="${tier.level}"></span><span>Cấp độ <span th:text="${tier.level}"></span></span><span class="library-count" th:text="|${tier.count} bài|"></span></summary>
                        <div class="library-topics">
                            <section class="library-topic" th:each="group:${tier.topics}">
                                <header><span class="library-topic-kind" th:text="${group.independent?'TỰ HỌC':'CHỦ ĐỀ'}"></span><h3 th:text="${group.name}"></h3><span class="library-count" th:text="|${#lists.size(group.lessons)} bài|"></span></header>
                                <ol class="library-lessons">
                                    <li th:each="lesson,lessonStat:${group.lessons}">
                                        <span class="library-lesson-number" th:text="${lessonStat.count}" aria-hidden="true"></span>
                                        <div class="library-lesson-body">
                                            <a class="library-lesson-title" th:href="@{/student/lessons/{id}(id=${lesson.id})}" th:text="${lesson.title}"></a>
                                            <p th:if="${!#strings.isEmpty(lesson.description)}" th:text="${lesson.description}"></p>
                                            <span class="library-task" th:if="${lesson.material!=null and !#strings.isEmpty(lesson.material.taskType)}" th:text="${lesson.material.taskType}"></span>
                                            <a class="library-flashcards" th:if="${lessonSets.containsKey(lesson.id)}" th:href="@{/student/flashcards/{id}(id=${lessonSets.get(lesson.id).id()})}"><span class="library-flashcard-mark" aria-hidden="true">▣</span><span><strong th:text="${lessonSets.get(lesson.id).title()}"></strong><small th:text="|${lessonSets.get(lesson.id).count()} thẻ từ vựng · Ôn flashcard →|"></small></span></a>
                                        </div>
                                        <a class="button button-secondary button-small library-open" th:href="@{/student/lessons/{id}(id=${lesson.id})}">Học bài →</a>
                                    </li>
                                </ol>
                            </section>
                        </div>
                    </details>
                </div>
            </details>
        </section>
        <div class="empty-box" th:if="${#lists.isEmpty(lessons)}"><div th:replace="~{fragments/navi :: navi('empty', 'Navi đang chờ bài học mới')}"></div><h2>Không tìm thấy bài học phù hợp</h2><p>Thử bộ lọc khác hoặc quay lại sau khi có nội dung mới.</p></div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
