<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AptisPrep - Nền tảng luyện thi Aptis chuẩn CEFR (Reading, Listening, Writing, Speaking) với lộ trình cá nhân hóa và chấm điểm thông minh."
    />
    <title>Chi tiết kết quả | AptisPrep</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6E56'/%3E%3Cpath d='M16 6 L24 25 L19.5 25 L17.5 20 L14.5 20 L12.5 25 L8 25 Z M16 12 L15.2 17 L16.8 17 Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/learning-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/navi.css}" />
    <link rel="stylesheet" th:href="@{/css/exam.css}" />
    <link rel="stylesheet" th:href="@{/css/result.css}" />
    <link rel="stylesheet" th:href="@{/css/catalog-compact.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-overview.css}" />
    <link rel="stylesheet" th:href="@{/css/typography.css}" />
    <script th:src="@{/js/app-dialog.js}" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body class="admin-theme">
    <header th:replace="~{fragments/admin-layout :: adminHeader}"></header>
    <div class="container app-shell">
      <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('results')}"></aside>
      <main class="app-main student-content attempt-result-page">
        <a class="back-link" th:href="@{/admin/results}">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m14 6-6 6 6 6" />
          </svg>
          <span>Quay lại</span>
        </a>

        <header class="page-header result-hero">
          <div>
            <p class="eyebrow" th:text="${@resultLabels.examType(attemptResult.examType)}"></p>
            <h1 th:text="${attemptResult.examTitle}"></h1>
          </div>
          <span class="result-status" th:text="${@resultLabels.state(attemptResult.state)}"></span>
        </header>
        <section class="dashboard-panel result-overall-panel">
          <div>
            <span
              th:text="${attemptResult.isCombined() ? 'Tổng bốn kỹ năng /200' : 'Điểm quy đổi'}"
            ></span>
            <strong
              th:text="${attemptResult.finalScaleScore==null?'—':attemptResult.finalScaleScore}"
            ></strong>
          </div>
          <div>
            <span th:text="${attemptResult.isCombined() ? 'CEFR tổng hợp' : 'CEFR kỹ năng'}"></span>
            <strong
              th:text="${attemptResult.overallCefr==null?'—':(attemptResult.overallCefr == 'A0' ? 'Dưới A1' : attemptResult.overallCefr)}"
            ></strong>
          </div>
        </section>
        <section class="result-skill-grid">
          <article
            class="dashboard-panel result-skill-card"
            th:each="skill : ${attemptResult.skills}"
          >
            <div class="result-skill-heading">
              <h2
                th:text="${skill.skill == 'GRAMMAR_VOCABULARY' ? 'Grammar & Vocabulary' : skill.skill}"
              ></h2>
              <strong
                th:unless="${attemptResult.isCombined() and skill.skill == 'GRAMMAR_VOCABULARY'}"
                th:text="${skill.estimatedLevel==null?'—':(skill.estimatedLevel == 'A0' ? 'Dưới A1' : skill.estimatedLevel)}"
              ></strong>
            </div>
            <dl class="result-score-list">
              <div th:with="score=${skill.scaleScore != null ? skill.scaleScore : skill.rawScore}">
                <dt>Điểm</dt>
                <dd
                  th:text="${score == null ? 'Chưa có' : score.stripTrailingZeros().toPlainString()}"
                ></dd>
              </div>
            </dl>
            <div class="result-feedback" th:if="${skill.feedback!=null}">
              <h3>Nhận xét</h3>
              <p th:text="${skill.feedback}"></p>
            </div>
          </article>
        </section>
        <section
          class="admin-result-review dashboard-panel"
          th:if="${review != null and !review.questions.isEmpty()}"
        >
          <div class="panel-heading">
            <div>
              <span class="panel-kicker">ĐỐI CHIẾU BÀI LÀM</span>
              <h2>Câu hỏi và đáp án</h2>
            </div>
            <span class="muted" th:text="${review.questions.size() + ' câu hỏi'}"></span>
          </div>
          <details class="admin-review-question" th:each="question : ${review.questions}">
            <summary>
              <span
                class="review-skill-badge"
                th:text="${question.skill == 'GRAMMAR_VOCABULARY' ? 'Grammar & Vocabulary' : question.skill}"
              ></span>
              <strong th:text="${'Câu ' + question.position + ' · ' + question.content}"></strong>
            </summary>
            <p
              class="review-instruction"
              th:if="${question.instruction != null}"
              th:text="${question.instruction}"
            ></p>
            <p
              class="reading-passage-text"
              th:if="${question.readingPassage != null}"
              th:text="${question.readingPassage}"
            ></p>
            <div class="admin-review-item" th:each="item : ${question.items}">
              <h3 th:text="${item.position + '. ' + item.content}"></h3>
              <ul class="review-options" th:if="${!item.options.isEmpty()}">
                <li
                  th:each="option : ${item.options}"
                  th:classappend="${(item.selectedOptionId == option.id ? ' is-selected' : '') + (option.correct ? ' is-correct' : '')}"
                >
                  <span class="review-option-code" th:text="${option.code}"></span>
                  <span class="review-option-content" th:text="${option.content}"></span>
                  <span class="review-option-status" th:if="${item.selectedOptionId == option.id}">
                    Đã chọn
                  </span>
                  <span class="review-option-status correct" th:if="${option.correct}">
                    Đáp án đúng
                  </span>
                </li>
              </ul>
              <p
                class="admin-answer-line"
                th:if="${item.userPosition != null}"
                th:text="${'Vị trí đã chọn: ' + item.userPosition + (item.correctPosition == null ? '' : ' · Đáp án đúng: ' + item.correctPosition)}"
              ></p>
              <p
                class="admin-answer-line"
                th:if="${item.textAnswer != null and !item.textAnswer.isBlank()}"
                th:text="${'Câu trả lời: ' + item.textAnswer}"
              ></p>
              <p class="admin-answer-empty" th:if="${!item.answered()}">Chưa trả lời</p>
            </div>
          </details>
        </section>
      </main>
    </div>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <span>© 2026 AptisPrep. Học đúng lộ trình, tiến bộ mỗi ngày.</span>
        <span>Nền tảng học tập và luyện thi Aptis</span>
      </div>
    </footer>
  </body>
</html>
