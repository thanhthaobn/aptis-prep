<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AptisPrep - Nền tảng luyện thi Aptis chuẩn CEFR (Reading, Listening, Writing, Speaking) với lộ trình cá nhân hóa và chấm điểm thông minh."
    />
    <title>Kết quả học viên | AptisPrep</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6E56'/%3E%3Cpath d='M16 6 L24 25 L19.5 25 L17.5 20 L14.5 20 L12.5 25 L8 25 Z M16 12 L15.2 17 L16.8 17 Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/learning-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/navi.css}" />
    <link rel="stylesheet" th:href="@{/css/exam.css}" />
    <link rel="stylesheet" th:href="@{/css/result.css}" />
    <link rel="stylesheet" th:href="@{/css/catalog-compact.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-overview.css}" />
    <link rel="stylesheet" th:href="@{/css/typography.css}" />
    <script th:src="@{/js/app-dialog.js}" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body class="admin-theme">
    <header th:replace="~{fragments/admin-layout :: adminHeader}"></header>
    <div class="container app-shell">
      <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('results')}"></aside>
      <main class="app-main admin-catalog">
        <header class="page-header">
          <div>
            <h1>Kết quả học viên</h1>
          </div>
        </header>
        <form class="dashboard-panel result-filters" method="get" th:action="@{/admin/results}">
          <div class="field">
            <label for="q">Học viên, email hoặc tên đề</label>
            <input id="q" name="q" th:value="${q}" maxlength="255" />
          </div>
          <div class="field">
            <label for="skill">Kỹ năng</label>
            <select id="skill" name="skill">
              <option value="">Tất cả</option>
              <option
                th:each="v : ${skills}"
                th:value="${v}"
                th:text="${(v == null ? null : v.replace('_', ' '))}"
                th:selected="${selectedSkill==v}"
              ></option>
            </select>
          </div>
          <div class="field">
            <label for="examType">Loại đề</label>
            <select id="examType" name="examType">
              <option value="">Tất cả</option>
              <option
                th:each="v : ${examTypes}"
                th:value="${v}"
                th:text="${@resultLabels.examType(v)}"
                th:selected="${selectedExamType==v}"
              ></option>
            </select>
          </div>
          <div class="field">
            <label for="state">Trạng thái</label>
            <select id="state" name="state">
              <option value="">Tất cả</option>
              <option
                th:each="v : ${resultStates}"
                th:value="${v}"
                th:text="${@resultLabels.state(v)}"
                th:selected="${selectedState==v}"
              ></option>
            </select>
          </div>
          <div class="field">
            <label for="from">Từ ngày</label>
            <input id="from" type="date" name="from" th:value="${from}" />
          </div>
          <div class="field">
            <label for="to">Đến ngày</label>
            <input id="to" type="date" name="to" th:value="${to}" />
          </div>
          <div class="actions">
            <button class="button" type="submit">Lọc kết quả</button>
            <a class="button button-secondary" th:href="@{/admin/results}">Xóa bộ lọc</a>
          </div>
        </form>
        <div class="section-title-row">
          <h2>Lịch sử lượt thi</h2>
          <span class="muted" th:text="${'' + (history.totalItems) + ' lượt'}"></span>
        </div>
        <div class="table-wrap" th:if="${!history.items.isEmpty()}">
          <table class="data-table admin-responsive-table result-history-table">
            <thead>
              <tr>
                <th scope="col">Học viên</th>
                <th scope="col">Bài thi</th>
                <th scope="col">Loại</th>
                <th scope="col">Trạng thái</th>
                <th scope="col">Nộp bài</th>
                <th scope="col">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${history.items}">
                <td data-label="Học viên">
                  <strong th:text="${item.learnerName}"></strong>
                  <p class="muted" th:text="${item.learnerEmail}"></p>
                </td>
                <td data-label="Bài thi" th:text="${item.result.examTitle}"></td>
                <td
                  data-label="Loại"
                  th:text="${@resultLabels.examType(item.result.examType)}"
                ></td>
                <td data-label="Trạng thái">
                  <span
                    class="badge"
                    th:classappend="${item.result.state == 'COMPLETED' ? 'badge-success' : (item.result.state == 'ERROR' or item.result.state == 'GRADING_FAILED' ? 'badge-danger' : 'badge-warning')}"
                    th:text="${@resultLabels.state(item.result.state)}"
                  ></span>
                </td>
                <td
                  data-label="Nộp bài"
                  th:text="${item.result.submittedAt==null?'Chưa nộp':#temporals.format(item.result.submittedAt, 'dd/MM/yyyy HH:mm')}"
                ></td>
                <td data-label="Thao tác">
                  <div class="catalog-table-actions">
                    <a th:href="@{/admin/results/{id}(id=${item.result.attemptId})}">
                      Xem chi tiết
                    </a>
                    <form
                      method="post"
                      th:action="@{/admin/results/{id}/delete(id=${item.result.attemptId})}"
                      data-confirm-title="Loại bỏ lượt thi?"
                      data-confirm-message="Lượt thi sẽ được ẩn khỏi danh sách quản trị; dữ liệu lịch sử vẫn được giữ lại."
                      data-confirm-button="Loại bỏ"
                    >
                      <button class="button button-danger button-small" type="submit">
                        Loại bỏ
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="empty-box" th:if="${history.items.isEmpty()}">
          <h2>Không có kết quả phù hợp</h2>
        </div>
        <th:block
          th:with="currentPage=${history.page}, totalItems=${history.totalItems}, baseUrl=@{/admin/results(size=${history.size},q=${q},skill=${selectedSkill},examType=${selectedExamType},state=${selectedState},from=${from},to=${to})}, pageParam='page'"
        >
          <nav
            th:with="pageUrl=${baseUrl + (#strings.contains(baseUrl, '?') ? '&' : '?') + pageParam + '='}"
            class="pagination student-pagination"
            aria-label="Phân trang"
          >
            <span th:text="${'' + (totalItems) + ' kết quả'}">0 kết quả</span>
            <div class="pagination-pages" th:if="${totalPages > 1}">
              <a
                class="page-link"
                th:if="${currentPage > 0}"
                th:href="${pageUrl + (currentPage - 1)}"
                aria-label="Trang trước"
              >
                ‹
              </a>
              <span
                class="page-link disabled"
                th:unless="${currentPage > 0}"
                aria-disabled="true"
                aria-label="Trang trước"
              >
                ‹
              </span>
              <th:block
                th:with="start=${currentPage > 2 ? currentPage - 2 : 0},end=${currentPage + 2 < totalPages ? currentPage + 2 : totalPages - 1}"
              >
                <a
                  class="page-link"
                  th:if="${start > 0}"
                  th:href="${pageUrl + '0'}"
                  aria-label="Trang 1"
                >
                  1
                </a>
                <span class="pagination-gap" th:if="${start > 1}" aria-hidden="true">…</span>
                <th:block th:each="index : ${#numbers.sequence(start, end)}">
                  <span
                    class="page-link active"
                    th:if="${index == currentPage}"
                    aria-current="page"
                    th:attr="aria-label=${'Trang ' + (index + 1)}"
                    th:text="${index + 1}"
                  ></span>
                  <a
                    class="page-link"
                    th:unless="${index == currentPage}"
                    th:href="${pageUrl + index}"
                    th:attr="aria-label=${'Trang ' + (index + 1)}"
                    th:text="${index + 1}"
                  ></a>
                </th:block>
                <span class="pagination-gap" th:if="${end < totalPages - 2}" aria-hidden="true">
                  …
                </span>
                <a
                  class="page-link"
                  th:if="${end < totalPages - 1}"
                  th:href="${pageUrl + (totalPages - 1)}"
                  th:attr="aria-label=${'Trang ' + (totalPages)}"
                  th:text="${totalPages}"
                ></a>
              </th:block>
              <a
                class="page-link"
                th:if="${currentPage + 1 < totalPages}"
                th:href="${pageUrl + (currentPage + 1)}"
                aria-label="Trang sau"
              >
                ›
              </a>
              <span
                class="page-link disabled"
                th:unless="${currentPage + 1 < totalPages}"
                aria-disabled="true"
                aria-label="Trang sau"
              >
                ›
              </span>
            </div>
            <span
              th:if="${totalPages > 1}"
              th:text="${'Trang ' + (currentPage + 1) + ' / ' + (totalPages)}"
            ></span>
          </nav>
        </th:block>
      </main>
    </div>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <span>© 2026 AptisPrep. Học đúng lộ trình, tiến bộ mỗi ngày.</span>
        <span>Nền tảng học tập và luyện thi Aptis</span>
      </div>
    </footer>
  </body>
</html>
