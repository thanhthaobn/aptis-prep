<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<figure th:fragment="navi(pose, label)" class="navi" th:classappend="'navi-' + ${pose}">
    <svg viewBox="0 0 160 130" role="img" th:attr="aria-label=${label}">
        <path class="navi-shadow" d="M36 118c0-8 21-14 46-14s46 6 46 14-21 10-46 10-46-2-46-10Z"></path>
        <path class="navi-body" d="M43 68c0-29 17-48 40-48s42 19 42 48c0 32-13 48-42 48S43 100 43 68Z"></path>
        <path class="navi-antenna" d="M82 21V9m0 0 9-5"></path>
        <circle class="navi-eye" cx="67" cy="63" r="5"></circle>
        <circle class="navi-eye" cx="99" cy="63" r="5"></circle>
        <path class="navi-mouth" d="M72 79c6 6 15 6 22 0"></path>
        <path class="navi-arm navi-arm-left" d="M46 73 25 61"></path>
        <path class="navi-arm navi-arm-right" d="m122 73 19-17"></path>
        <g th:if="${pose == 'celebrate'}" aria-hidden="true">
            <path class="confetti" d="m25 24 5 7m99-10-6 8M44 9l2 8m75 27 8 2"></path>
        </g>
        <path th:if="${pose == 'help'}" class="navi-question" d="M136 20c0-8 13-9 13 0 0 5-6 5-6 10m0 7h.01" aria-hidden="true"></path>
    </svg>
    <figcaption th:text="${label}">Navi đồng hành cùng bạn</figcaption>
</figure>
</body>
</html>
