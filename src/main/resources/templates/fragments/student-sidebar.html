<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <aside class="app-sidebar" th:fragment="studentSidebar(activePage)">
      <button
        class="sidebar-toggle collapsed"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#student-sidebar-content"
        aria-expanded="false"
        aria-controls="student-sidebar-content"
      >
        <span>Menu học tập</span><span class="sidebar-toggle-icon" aria-hidden="true">⌄</span>
      </button>
      <div class="sidebar-content collapse d-lg-block" id="student-sidebar-content">
        <span class="sidebar-label">HỌC TẬP</span>
        <nav class="sidebar-nav" aria-label="Điều hướng học tập">
          <a
            class="sidebar-link"
            th:classappend="${activePage == 'dashboard'} ? 'active'"
            th:href="@{/student/dashboard}"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z" /></svg
            >Tổng quan</a
          >
          <a
            class="sidebar-link"
            th:classappend="${activePage == 'placement'} ? 'active'"
            th:href="@{/student/placement}"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19V5m0 14h16M8 16v-4m4 4V7m4 9v-6" /></svg
            >Kiểm tra đầu vào</a
          >
          <a
            class="sidebar-link"
            th:classappend="${activePage == 'learning-path'} ? 'active'"
            th:href="@{/student/learning-path}"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 5h4v4H5zM15 15h4v4h-4zM9 7h3a5 5 0 0 1 5 5v3" /></svg
            >Lộ trình của tôi</a
          >
          <a
            class="sidebar-link"
            th:classappend="${activePage == 'lessons'} ? 'active'"
            th:href="@{/student/lessons}"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z" /></svg
            >Bài học</a
          >
          <a
            class="sidebar-link"
            th:classappend="${activePage == 'exams'} ? 'active'"
            th:href="@{/student/exams}"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 3h10v4H7zM5 7h14v14H5z" /></svg
            >Đề thi</a
          >
          <a
            class="sidebar-link"
            th:classappend="${activePage == 'results'} ? 'active'"
            th:href="@{/student/results}"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19V5m0 14h16M8 16v-4m4 4V7m4 9v-6" /></svg
            >Kết quả</a
          >
          <a
            class="sidebar-link"
            th:classappend="${activePage == 'flashcards'} ? 'active'"
            th:href="@{/student/flashcards}"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="6" width="15" height="15" rx="3" />
              <path d="M17 6V3H3v14h3" /></svg
            >Flashcard</a
          >
        </nav>
        <div class="sidebar-divider"></div>
        <span class="sidebar-label">TÀI KHOẢN</span>
        <nav class="sidebar-nav">
          <a
            class="sidebar-link"
            th:classappend="${activePage == 'profile'} ? 'active'"
            th:href="@{/student/profile}"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21a8 8 0 0 1 16 0" /></svg
            >Hồ sơ</a
          >
        </nav>
      </div>
    </aside>
  </body>
</html>
