<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head(${catalog.title})}"></head>
  <body class="admin-theme">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container ap-container app-shell">
      <div th:replace="~{fragments/admin-sidebar :: adminSidebar(${catalog.key})}"></div>
      <main id="main-content" tabindex="-1" class="app-main admin-catalog">
        <div th:replace="~{fragments/back-link :: backLink(@{${catalog.baseUrl()}})}"></div>
        <header class="page-header">
          <div>
            <h1 th:text="${editing ? 'Chỉnh sửa ' + catalog.singular : catalog.createLabel}"></h1>
          </div>
        </header>
        <th:block th:if="${catalog.key == 'questions'}">
          <form th:replace="~{admin/catalog/question-form :: questionForm}"></form>
        </th:block>
        <th:block th:if="${catalog.key == 'exams'}">
          <form th:replace="~{admin/catalog/exam-form :: examForm}"></form>
        </th:block>
      </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/catalog-editor.js}" defer></script>
  </body>
</html>
