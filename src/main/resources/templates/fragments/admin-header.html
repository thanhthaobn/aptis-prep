<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <header th:fragment="adminHeader" class="site-header">
      <a href="#main-content" class="ap-skip-link">Bỏ qua điều hướng</a>

      <div class="container ap-container nav-wrap">
        <a class="brand" th:href="@{/}">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 19V7.5L12 4l7 3.5V19" />
              <path d="M8.5 10.5 12 12l3.5-1.5M12 12v8" />
            </svg>
          </span>
          <span>AptisPrep</span>
        </a>

        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-label="Mở menu điều hướng"
          aria-expanded="false"
          aria-controls="primaryNav"
        >
          <svg
            class="hamburger-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <nav class="nav-links" id="primaryNav" aria-label="Điều hướng chính">
          <a th:href="@{/}">Trang chủ</a>
          <a th:if="${isStudent}" th:href="@{/student/dashboard}">Học tập</a>
          <a
            th:if="${isAdmin != false}"
            th:href="@{/admin/dashboard}"
            th:classappend="'active'"
            aria-current="page"
          >
            Quản trị
          </a>
          <a th:if="${signedIn != true}" th:href="@{/login}">Đăng nhập</a>
          <a th:if="${signedIn != true}" class="button button-small" th:href="@{/register}">
            Đăng ký
          </a>
          <form th:action="@{/logout}" method="post">
            <button class="button button-secondary button-small" type="submit">Đăng xuất</button>
          </form>
        </nav>
      </div>

      <script th:src="@{/js/navigation.js}" defer></script>
    </header>
  </body>
</html>
