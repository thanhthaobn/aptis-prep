spring.application.name=aptis-prep

# One application configuration. Credentials stay outside source control.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=aptisprep_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

server.port=8080
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APTIS_SESSION_SECURE_COOKIE:false}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Install database/schema-current.sql explicitly on a NEW EMPTY database only.
spring.sql.init.mode=never

spring.thymeleaf.cache=false

# Keep explicit restart trigger while rebuilding the merged application.
spring.devtools.restart.trigger-file=.reloadtrigger

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=80MB
# Lesson editor: up to 20 questions plus teaching fields and file inputs.
server.tomcat.max-part-count=300

app.storage.upload-dir=uploads

app.ai.enabled=${GEMINI_ENABLED:true}
app.ai.api-key=${GEMINI_API_KEY:AQ.Ab8RN6J1oDCUk8sI3pTJaVFiiFf0auUb4XHnnV07OW1N5hlulg}
app.ai.grading-model=${GEMINI_GRADING_MODEL:gemini-3.5-flash-lite}

# Optional metadata fallback for WEBM or media not readable by the Java audio parser.
# Install ffprobe on the server PATH or set an absolute executable path here.
app.media.ffprobe-path=${FFPROBE_PATH:ffprobe}
