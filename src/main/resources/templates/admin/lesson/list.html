<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AptisPrep - Nền tảng luyện thi Aptis chuẩn CEFR (Reading, Listening, Writing, Speaking) với lộ trình cá nhân hóa và chấm điểm thông minh."
    />
    <title>Quản lý bài học | AptisPrep</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6E56'/%3E%3Cpath d='M16 6 L24 25 L19.5 25 L17.5 20 L14.5 20 L12.5 25 L8 25 Z M16 12 L15.2 17 L16.8 17 Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/learning-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/navi.css}" />
    <link rel="stylesheet" th:href="@{/css/exam.css}" />
    <link rel="stylesheet" th:href="@{/css/result.css}" />
    <link rel="stylesheet" th:href="@{/css/catalog-compact.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-overview.css}" />
    <link rel="stylesheet" th:href="@{/css/typography.css}" />
    <script th:src="@{/js/app-dialog.js}" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body class="admin-theme">
    <header th:replace="~{fragments/admin-layout :: adminHeader}"></header>
    <div class="container ap-container app-shell">
      <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('lessons')}"></aside>
      <main id="main-content" tabindex="-1" class="app-main admin-catalog admin-lesson-tree">
        <header class="page-header">
          <div>
            <h1>Quản lý bài học</h1>
          </div>
        </header>
        <section class="curriculum-tree" aria-label="Cây quản lý bài học">
          <details
            class="dashboard-panel skill-branch"
            th:each="branch : ${tree}"
            th:attr="data-skill=${branch.skill()}"
          >
            <summary>
              <strong th:text="${branch.skill()}"></strong>
              <span th:text="${'' + (branch.count()) + ' bài học'}"></span>
            </summary>
            <details class="level-branch" th:each="level : ${branch.levels()}">
              <summary>
                <strong th:text="${level.level()}"></strong>
                <span th:text="${'' + (level.lessons().size()) + ' bài học'}"></span>
              </summary>
              <details class="topic-branch" th:each="topic : ${level.topics()}">
                <summary th:text="${topic.key}"></summary>
                <ul class="lesson-leaves">
                  <li th:each="lesson : ${topic.value}" class="admin-lesson-leaf">
                    <div class="lesson-leaf-title">
                      <span class="muted" th:text="${'' + (lesson.displayOrder) + '.'}"></span>
                      <a
                        th:href="@{/admin/lessons/{id}(id=${lesson.id})}"
                        th:text="${lesson.title}"
                      ></a>
                      <span
                        class="badge"
                        th:classappend="${lesson.status == 'PUBLISHED'} ? 'badge-success'"
                        th:text="${lesson.status=='PUBLISHED'?'Đã công bố':(lesson.status=='DRAFT'?'Bản nháp':'Đã lưu trữ')}"
                      ></span>
                    </div>
                    <div class="catalog-table-actions lesson-leaf-actions">
                      <a
                        class="button button-secondary"
                        th:href="@{/admin/lessons/{id}(id=${lesson.id})}"
                      >
                        Xem trước
                      </a>
                      <a class="button" th:href="@{/admin/lessons/{id}/edit(id=${lesson.id})}">
                        Chỉnh sửa
                      </a>
                    </div>
                  </li>
                </ul>
                <a
                  class="button button-secondary"
                  th:href="@{/admin/lessons/create(skill=${branch.skill()},level=${level.level()},topic=${topic.key=='Bài học độc lập'?'':topic.key})}"
                >
                  + Thêm bài trong chủ đề
                </a>
              </details>
              <p class="muted" th:if="${level.lessons() == null or level.lessons().isEmpty()}">
                Chưa có bài học ở cấp độ này.
              </p>
              <a
                class="button button-secondary"
                th:href="@{/admin/lessons/create(skill=${branch.skill()},level=${level.level()})}"
                th:text="${'+ Thêm bài vào ' + (branch.skill()) + ' ' + (level.level())}"
              ></a>
            </details>
          </details>
        </section>
      </main>
    </div>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <span>© 2026 AptisPrep. Học đúng lộ trình, tiến bộ mỗi ngày.</span>
        <span>Nền tảng học tập và luyện thi Aptis</span>
      </div>
    </footer>
  </body>
</html>
