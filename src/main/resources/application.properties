spring.application.name=aptis-prep
spring.profiles.active=dev

server.port=8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false

# Restart only after an explicit trigger; rebuilding target/classes must not
# restart the running application halfway through compilation.
spring.devtools.restart.trigger-file=.reloadtrigger

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

app.storage.upload-dir=uploads

app.ai.enabled=${OPENAI_ENABLED:false}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.grading-model=${OPENAI_GRADING_MODEL:gpt-4.1-mini}
app.ai.transcription-model=${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
