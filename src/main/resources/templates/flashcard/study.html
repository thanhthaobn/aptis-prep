<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${set.title})}"></head>
<body class="student-theme flashcard-page">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container app-shell">
<div th:replace="~{fragments/student-sidebar :: studentSidebar('flashcards')}"></div>
<main class="app-main flashcard-study" th:attr="data-set-id=${set.id}">
<a class="lesson-back" th:href="@{/student/flashcards}">← Quay lại bộ thẻ</a>
<header class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3"><div><p class="eyebrow">CHẾ ĐỘ HỌC</p><h1 th:text="${set.title}"></h1><p th:text="${set.description}"></p></div><span class="badge" th:text="${set.cefrLevel}"></span></header>
<section id="study-session">
<div class="toolbar flashcard-options d-flex flex-wrap align-items-center gap-3"><label class="flashcard-toggle"><input id="reverse" type="checkbox"> Hiện nghĩa trước</label><label class="flashcard-toggle"><input id="unlearned" type="checkbox"> Chỉ học thẻ chưa thuộc</label><button class="button button-secondary" id="shuffle" type="button">Trộn thẻ</button></div>
<div class="study-summary d-flex align-items-center justify-content-between gap-3"><p id="study-stats" role="status"></p><span id="position" aria-live="polite"></span></div>
<div class="flashcard-stage" id="card-stage"><button type="button" class="flashcard-3d" id="flip" aria-label="Lật thẻ" aria-pressed="false"><span class="flashcard-inner"><span class="flashcard-side flashcard-front"><span class="face-label" id="front-label">THUẬT NGỮ</span><strong class="face-content" id="front-content"></strong><small>Bấm hoặc nhấn Space để lật</small></span><span class="flashcard-side flashcard-back"><span class="face-label" id="back-label">ĐỊNH NGHĨA</span><strong class="face-content" id="back-content"></strong><small>Bấm để quay lại</small></span></span></button></div>
<div class="actions flashcard-controls d-flex justify-content-center gap-3"><button type="button" class="button button-secondary" id="previous">← Thẻ trước</button><button type="button" class="button button-secondary" id="next">Thẻ tiếp →</button></div>
<div class="actions flashcard-controls mastery-controls d-flex justify-content-center gap-3"><button type="button" class="button button-secondary" id="learning">Cần học lại</button><button type="button" class="button" id="mastered">Đã nhớ</button></div>
<p id="save-message" role="status" aria-live="polite"></p><p class="keyboard-hint">Hãy xếp mỗi thẻ vào “Đã nhớ” hoặc “Cần học lại” để hoàn thành lượt học.</p>
</section>
<section id="round-results" class="dashboard-panel flashcard-results" hidden aria-live="polite">
<p class="eyebrow">TỔNG KẾT LƯỢT HỌC</p><h2>Đã hoàn thành bộ thẻ</h2>
<div class="result-metrics"><div><strong id="result-mastered">0</strong><span>Đã nhớ</span></div><div><strong id="result-learning">0</strong><span>Cần học lại</span></div></div>
<div id="review-list-wrap"><h3>Những từ bạn cần ôn lại</h3><dl id="review-terms" class="review-term-list"></dl></div>
<p id="all-mastered-message" hidden>Bạn đã nhớ toàn bộ thẻ trong lượt này.</p>
<div class="actions result-actions"><button type="button" class="button" id="review-learning">Ôn lại thẻ chưa thuộc</button><button type="button" class="button button-secondary" id="review-all">Học lại tất cả</button><a class="button button-secondary" th:href="@{/student/flashcards}">Về danh sách bộ thẻ</a></div>
</section>
<form id="csrf-holder" method="post" th:action="@{/student/flashcards/{id}/cards/0/state(id=${set.id})}" hidden></form>
<section id="study-data" hidden><div th:each="card:${cards}" th:attr="data-id=${card.id()},data-state=${card.state()}"><span class="term" th:text="${card.term()}"></span><span class="definition" th:text="${card.definition()}"></span></div></section>
<details class="dashboard-panel dashboard-section term-overview"><summary>Xem toàn bộ thuật ngữ</summary><dl class="term-list"><div th:each="card:${cards}"><dt th:text="${card.term()}"></dt><dd th:text="${card.definition()}"></dd></div></dl></details>
</main></div><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/flashcard-study.js}" defer></script></body></html>
