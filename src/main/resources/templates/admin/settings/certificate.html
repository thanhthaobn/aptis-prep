<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AptisPrep - Nền tảng luyện thi Aptis chuẩn CEFR (Reading, Listening, Writing, Speaking) với lộ trình cá nhân hóa và chấm điểm thông minh."
    />
    <title>Chứng chỉ | AptisPrep</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6E56'/%3E%3Cpath d='M16 6 L24 25 L19.5 25 L17.5 20 L14.5 20 L12.5 25 L8 25 Z M16 12 L15.2 17 L16.8 17 Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/learning-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/navi.css}" />
    <link rel="stylesheet" th:href="@{/css/exam.css}" />
    <link rel="stylesheet" th:href="@{/css/result.css}" />
    <link rel="stylesheet" th:href="@{/css/catalog-compact.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-overview.css}" />
    <link rel="stylesheet" th:href="@{/css/typography.css}" />
    <script th:src="@{/js/app-dialog.js}" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body class="admin-theme">
    <header th:replace="~{fragments/admin-layout :: adminHeader}"></header>
    <div class="container ap-container app-shell">
      <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('certificates')}"></aside>
      <main id="main-content" tabindex="-1" class="app-main admin-catalog">
        <a class="back-link" th:href="@{/admin/certificates}">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m14 6-6 6 6 6" />
          </svg>
          <span>Quay lại</span>
        </a>
        <div class="messages-container" aria-live="polite">
          <div
            class="alert alert-success ap-alert ap-alert-success"
            role="status"
            th:if="${successMessage != null or (message != null and error == null)}"
            th:text="${successMessage != null ? successMessage : message}"
          ></div>
          <div
            class="alert alert-danger ap-alert ap-alert-danger"
            role="alert"
            th:if="${errorMessage != null or error != null}"
            th:text="${errorMessage != null ? errorMessage : error}"
          ></div>
          <div
            class="alert alert-warning ap-alert ap-alert-warning"
            role="alert"
            th:if="${warningMessage != null or warning != null}"
            th:text="${warningMessage != null ? warningMessage : warning}"
          ></div>
          <div
            class="alert alert-info ap-alert ap-alert-info"
            role="status"
            th:if="${infoMessage != null or info != null}"
            th:text="${infoMessage != null ? infoMessage : info}"
          ></div>
        </div>
        <header class="page-header">
          <h1
            th:text="${readOnly ? certificate.name : (editing ? 'Chỉnh sửa chứng chỉ' : 'Thêm chứng chỉ')}"
          ></h1>
        </header>
        <form
          class="dashboard-panel"
          th:object="${certificateForm}"
          th:action="${editing ? '/admin/certificates/' + certificate.id : '/admin/certificates'}"
          method="post"
        >
          <fieldset class="scoring-fields" th:disabled="${readOnly}">
            <legend>Thông tin chứng chỉ</legend>
            <div class="catalog-form-grid">
              <div class="field">
                <label for="certificateName">Tên chứng chỉ</label>
                <input id="certificateName" th:field="*{name}" maxlength="255" required />
                <p class="field-error" th:errors="*{name}"></p>
              </div>
              <div class="field">
                <label for="certificateCode">Mã chứng chỉ</label>
                <input id="certificateCode" th:field="*{code}" maxlength="50" required />
                <p class="field-error" th:errors="*{code}"></p>
              </div>
            </div>
            <div class="field">
              <label for="certificateDescription">Mô tả</label>
              <textarea id="certificateDescription" th:field="*{description}" rows="3"></textarea>
              <p class="field-error" th:errors="*{description}"></p>
            </div>
            <div class="field">
              <label for="certificateStatus">Trạng thái</label>
              <select id="certificateStatus" th:field="*{status}">
                <option value="DRAFT">Bản nháp</option>
                <option th:if="${editing}" value="ACTIVE">Đang sử dụng</option>
                <option th:if="${editing}" value="INACTIVE">Ngừng sử dụng</option>
              </select>
            </div>
          </fieldset>
          <div class="alert alert-danger" th:if="${!#fields.globalErrors().isEmpty()}">
            <span th:each="message, status : ${#fields.globalErrors()}">
              <br th:if="${!status.first}" />
              <span th:text="${message}"></span>
            </span>
          </div>
          <div class="actions">
            <a
              th:if="${readOnly}"
              class="button"
              th:href="@{/admin/certificates/{id}/edit(id=${certificate.id})}"
            >
              Chỉnh sửa
            </a>
            <button
              th:unless="${readOnly}"
              class="button"
              type="submit"
              th:text="${editing ? 'Lưu chứng chỉ' : 'Lưu bản nháp'}"
            >
              Lưu bản nháp
            </button>
            <a class="back-link" th:href="@{/admin/certificates}">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="m14 6-6 6 6 6" />
              </svg>
              <span>Quay lại</span>
            </a>
          </div>
        </form>
        <form
          th:if="${editing and certificate.status == 'ACTIVE'}"
          th:action="@{/admin/certificates/{id}/disable(id=${certificate.id})}"
          method="post"
        >
          <button class="button button-secondary" type="submit">Ngừng sử dụng</button>
        </form>
        <form
          th:if="${editing and certificate.status != 'ACTIVE'}"
          th:action="@{/admin/certificates/{id}/activate(id=${certificate.id})}"
          method="post"
        >
          <button class="button" type="submit">Kích hoạt chứng chỉ</button>
        </form>
      </main>
    </div>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <span>© 2026 AptisPrep. Học đúng lộ trình, tiến bộ mỗi ngày.</span>
        <span>Nền tảng học tập và luyện thi Aptis</span>
      </div>
    </footer>
  </body>
</html>
