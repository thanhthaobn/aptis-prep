<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="studentPagination(currentPage, totalPages, totalItems, baseUrl)">
      <nav
        th:replace="~{fragments/student-pagination :: listPagination(${currentPage}, ${totalPages}, ${totalItems}, ${baseUrl}, 'page')}"
      ></nav>
    </th:block>
    <nav
      th:fragment="listPagination(currentPage, totalPages, totalItems, baseUrl, pageParam)"
      th:with="pageUrl=${baseUrl + (#strings.contains(baseUrl, '?') ? '&' : '?') + pageParam + '='}"
      class="pagination student-pagination"
      aria-label="Phân trang"
    >
      <span th:text="${'' + (totalItems) + ' kết quả'}">0 kết quả</span>
      <div class="pagination-pages" th:if="${totalPages > 1}">
        <a
          class="page-link"
          th:if="${currentPage > 0}"
          th:href="${pageUrl + (currentPage - 1)}"
          aria-label="Trang trước"
        >
          ‹
        </a>
        <span
          class="page-link disabled"
          th:unless="${currentPage > 0}"
          aria-disabled="true"
          aria-label="Trang trước"
        >
          ‹
        </span>
        <th:block
          th:with="start=${currentPage > 2 ? currentPage - 2 : 0},end=${currentPage + 2 < totalPages ? currentPage + 2 : totalPages - 1}"
        >
          <a class="page-link" th:if="${start > 0}" th:href="${pageUrl + '0'}" aria-label="Trang 1">
            1
          </a>
          <span class="pagination-gap" th:if="${start > 1}" aria-hidden="true">…</span>
          <th:block th:each="index : ${display.pageNumbers(start, end)}">
            <span
              class="page-link active"
              th:if="${index == currentPage}"
              aria-current="page"
              th:attr="aria-label=${'Trang ' + (index + 1)}"
              th:text="${index + 1}"
            ></span>
            <a
              class="page-link"
              th:unless="${index == currentPage}"
              th:href="${pageUrl + index}"
              th:attr="aria-label=${'Trang ' + (index + 1)}"
              th:text="${index + 1}"
            ></a>
          </th:block>
          <span class="pagination-gap" th:if="${end < totalPages - 2}" aria-hidden="true">…</span>
          <a
            class="page-link"
            th:if="${end < totalPages - 1}"
            th:href="${pageUrl + (totalPages - 1)}"
            th:attr="aria-label=${'Trang ' + (totalPages)}"
            th:text="${totalPages}"
          ></a>
        </th:block>
        <a
          class="page-link"
          th:if="${currentPage + 1 < totalPages}"
          th:href="${pageUrl + (currentPage + 1)}"
          aria-label="Trang sau"
        >
          ›
        </a>
        <span
          class="page-link disabled"
          th:unless="${currentPage + 1 < totalPages}"
          aria-disabled="true"
          aria-label="Trang sau"
        >
          ›
        </span>
      </div>
      <span
        th:if="${totalPages > 1}"
        th:text="${'Trang ' + (currentPage + 1) + ' / ' + (totalPages)}"
      ></span>
    </nav>
  </body>
</html>
