<!doctype html>
<!--/*@thymesVar id="display" type="com.aptisprep.controller.DisplayFormatting"*/-->
<!--/*@thymesVar id="registerForm" type="com.aptisprep.dto.form.RegisterForm"*/-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Đăng ký')}"></head>
  <body class="landing-theme account-page">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main id="main-content" tabindex="-1" class="auth-page">
      <div class="container ap-container auth-layout">
        <section class="auth-welcome" aria-label="Bắt đầu hành trình">
          <div th:replace="~{fragments/navi :: navi('welcome', 'Navi đồng hành cùng bạn')}"></div>
          <p class="eyebrow">BẮT ĐẦU TỪ HÔM NAY</p>
          <h2>Một thói quen nhỏ. Một hành trình mới.</h2>
          <p>
            Khám phá trước, chọn mục tiêu sau. Bạn không cần làm bài đầu vào để bắt đầu tìm hiểu.
          </p>
        </section>
        <div class="form-card">
          <span class="form-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8M19 8v6m3-3h-6"
              />
            </svg>
          </span>
          <h1>Tạo tài khoản</h1>

          <form
            th:action="@{/register}"
            th:object="${registerForm}"
            method="post"
            data-account-form
          >
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div
              class="alert alert-danger"
              th:if="${!display.globalErrors('registerForm').isEmpty()}"
              role="alert"
            >
              <span th:each="message, status : ${display.globalErrors('registerForm')}">
                <br th:if="${!status.first}" />
                <span th:text="${message}"></span>
              </span>
            </div>
            <div class="field">
              <label for="fullName">Họ và tên</label>
              <input
                id="fullName"
                aria-describedby="fullName-error"
                th:attr="aria-invalid=${display.fieldInvalid('registerForm', 'fullName')}"
                th:field="*{fullName}"
                autocomplete="name"
                placeholder="Nguyễn Văn An"
                maxlength="255"
                required
              />
              <span id="fullName-error" class="field-error" aria-live="polite">
                <span th:errors="*{fullName}"></span>
              </span>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                aria-describedby="email-error"
                th:attr="aria-invalid=${display.fieldInvalid('registerForm', 'email')}"
                th:field="*{email}"
                type="email"
                autocomplete="email"
                placeholder="name@example.com"
                maxlength="255"
                required
              />
              <span id="email-error" class="field-error" aria-live="polite">
                <span th:errors="*{email}"></span>
              </span>
            </div>
            <div class="field">
              <label for="password">Mật khẩu</label>
              <small id="password-hint">Từ 8 ký tự, tránh mật khẩu dễ đoán.</small>
              <div class="password-input">
                <input
                  id="password"
                  aria-describedby="password-hint password-error"
                  th:attr="aria-invalid=${display.fieldInvalid('registerForm', 'password')}"
                  th:field="*{password}"
                  type="password"
                  autocomplete="new-password"
                  data-password-policy
                  placeholder="Tối thiểu 8 ký tự"
                  minlength="8"
                  maxlength="72"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  data-toggle-password="password"
                  aria-controls="password"
                  aria-pressed="false"
                  aria-label="Hiện mật khẩu"
                >
                  Hiện
                </button>
              </div>
              <span id="password-error" class="field-error" aria-live="polite">
                <span th:errors="*{password}"></span>
              </span>
            </div>
            <div class="field">
              <label for="confirmPassword">Xác nhận mật khẩu</label>
              <div class="password-input">
                <input
                  id="confirmPassword"
                  aria-describedby="confirmPassword-error"
                  th:attr="aria-invalid=${display.fieldInvalid('registerForm', 'confirmPassword')}"
                  th:field="*{confirmPassword}"
                  type="password"
                  autocomplete="new-password"
                  data-password-confirm
                  maxlength="72"
                  placeholder="Nhập lại mật khẩu"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  data-toggle-password="confirmPassword"
                  aria-controls="confirmPassword"
                  aria-pressed="false"
                  aria-label="Hiện mật khẩu"
                >
                  Hiện
                </button>
              </div>
              <span id="confirmPassword-error" class="field-error" aria-live="polite">
                <span th:errors="*{confirmPassword}"></span>
              </span>
            </div>
            <button class="button button-block" type="submit">Đăng ký</button>
          </form>
          <p class="form-note">
            Đã có tài khoản?
            <a th:href="@{/login}">Đăng nhập</a>
          </p>
        </div>
      </div>
    </main>
    <script th:src="@{/js/account-forms.js}" defer></script>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
