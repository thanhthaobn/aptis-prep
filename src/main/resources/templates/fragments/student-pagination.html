<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <nav
      th:fragment="pagination(currentPage, totalPages, totalItems, baseUrl)"
      class="pagination student-pagination"
      aria-label="Phân trang"
    >
      <span th:text="|${totalItems} kết quả|">0 kết quả</span>
      <div class="pagination-pages" th:if="${totalPages > 0}">
        <a
          class="page-link"
          th:if="${currentPage > 0}"
          th:href="${baseUrl + '&page=' + (currentPage - 1)}"
          aria-label="Trang trước"
          >‹</a
        >
        <span
          class="page-link disabled"
          th:unless="${currentPage > 0}"
          aria-disabled="true"
          aria-label="Trang trước"
          >‹</span
        >
        <th:block
          th:with="start=${currentPage > 2 ? currentPage - 2 : 0},end=${currentPage + 2 < totalPages ? currentPage + 2 : totalPages - 1}"
        >
          <a
            class="page-link"
            th:if="${start > 0}"
            th:href="${baseUrl + '&page=0'}"
            aria-label="Trang 1"
            >1</a
          >
          <span class="pagination-gap" th:if="${start > 1}" aria-hidden="true">…</span>
          <th:block th:each="index : ${#numbers.sequence(start, end)}">
            <span
              class="page-link active"
              th:if="${index == currentPage}"
              aria-current="page"
              th:attr="aria-label=|Trang ${index + 1}|"
              th:text="${index + 1}"
            ></span>
            <a
              class="page-link"
              th:unless="${index == currentPage}"
              th:href="${baseUrl + '&page=' + index}"
              th:attr="aria-label=|Trang ${index + 1}|"
              th:text="${index + 1}"
            ></a>
          </th:block>
          <span class="pagination-gap" th:if="${end < totalPages - 2}" aria-hidden="true">…</span>
          <a
            class="page-link"
            th:if="${end < totalPages - 1}"
            th:href="${baseUrl + '&page=' + (totalPages - 1)}"
            th:attr="aria-label=|Trang ${totalPages}|"
            th:text="${totalPages}"
          ></a>
        </th:block>
        <a
          class="page-link"
          th:if="${currentPage + 1 < totalPages}"
          th:href="${baseUrl + '&page=' + (currentPage + 1)}"
          aria-label="Trang sau"
          >›</a
        >
        <span
          class="page-link disabled"
          th:unless="${currentPage + 1 < totalPages}"
          aria-disabled="true"
          aria-label="Trang sau"
          >›</span
        >
      </div>
      <span th:if="${totalPages > 0}" th:text="|Trang ${currentPage + 1} / ${totalPages}|"></span>
    </nav>
  </body>
</html>
