<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tài khoản bị khóa | AptisPrep</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
  </head>
  <body class="landing-theme">
    <main class="container ap-container auth-page">
      <section class="form-card" role="alert">
        <p class="eyebrow">TÀI KHOẢN</p>
        <h1>Tài khoản đã bị khóa</h1>
        <p>Quản trị viên đã khóa tài khoản của bạn.</p>
        <div class="alert alert-danger ap-alert ap-alert-danger">
          <strong>Lý do:</strong>
          <span th:text="${lockReason ?: 'Tài khoản đã bị khóa bởi quản trị viên.'}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success ap-alert ap-alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger ap-alert ap-alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${latestRequest != null}" class="alert alert-info ap-alert">
          Yêu cầu gần nhất: <strong th:text="${latestRequest.status}"></strong>
          <span th:if="${latestRequest.adminNote != null}"> — <span th:text="${latestRequest.adminNote}"></span></span>
        </div>
        <form th:action="@{/account-unlock-request}" method="post" class="mt-4">
          <h2 class="h5">Gửi yêu cầu mở khóa</h2>
          <p class="text-muted">Nhập lại thông tin đăng nhập và lý do để quản trị viên xem xét.</p>
          <label class="form-label" for="unlock-email">Email</label>
          <input id="unlock-email" class="form-control mb-3" type="email" name="email" th:value="${email}" required maxlength="255" />
          <label class="form-label" for="unlock-password">Mật khẩu</label>
          <input id="unlock-password" class="form-control mb-3" type="password" name="password" required maxlength="72" />
          <label class="form-label" for="unlock-message">Lý do</label>
          <textarea id="unlock-message" class="form-control mb-3" name="message" rows="4" maxlength="1000" required></textarea>
          <button class="button button-block" type="submit">Gửi yêu cầu</button>
        </form>
        <a class="button button-block" th:href="@{/login}">Quay lại đăng nhập</a>
      </section>
    </main>
  </body>
</html>
