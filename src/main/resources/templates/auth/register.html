<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng ký')}"></head>
<body class="landing-theme">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="auth-page">
  <div class="container auth-layout">
    <section class="auth-welcome" aria-label="Bắt đầu hành trình">
        <div th:replace="~{fragments/study-guide :: guide}"></div>
        <p class="eyebrow">BẮT ĐẦU TỪ HÔM NAY</p>
        <h2>Một thói quen nhỏ. Một hành trình mới.</h2>
        <p>Khám phá trước, chọn mục tiêu sau. Bạn không cần làm bài đầu vào để bắt đầu tìm hiểu.</p>
    </section>
    <div class="form-card">
        <span class="form-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8M19 8v6m3-3h-6"/></svg></span>
        <h1>Tạo tài khoản</h1>
        <p class="form-intro">Tạo tài khoản để bắt đầu học.</p>
        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"
                 th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            <div class="field">
                <label for="fullName">Họ và tên</label>
                <input id="fullName" th:field="*{fullName}" autocomplete="name" placeholder="Nguyễn Văn An">
                <span class="field-error" th:errors="*{fullName}"></span>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" th:field="*{email}" type="email" autocomplete="email" placeholder="name@example.com">
                <span class="field-error" th:errors="*{email}"></span>
            </div>
            <div class="field">
                <label for="password">Mật khẩu</label>
                <input id="password" th:field="*{password}" type="password" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự">
                <span class="field-error" th:errors="*{password}"></span>
            </div>
            <div class="field">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu">
                <span class="field-error" th:errors="*{confirmPassword}"></span>
            </div>
            <button class="button button-block" type="submit">Đăng ký</button>
        </form>
        <p class="form-note">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
