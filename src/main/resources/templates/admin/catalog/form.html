<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${catalog.title})}"></head>
<body class="admin-theme">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container app-shell">
    <div th:replace="~{fragments/admin-sidebar :: adminSidebar(${catalog.key})}"></div>
    <main class="app-main admin-catalog">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb(${catalog.title}, @{${catalog.baseUrl()}}, ${editing ? 'Chỉnh sửa' : catalog.createLabel})}"></div>
        <header class="page-header"><div><h1 th:text="${editing ? 'Chỉnh sửa ' + catalog.singular : catalog.createLabel}"></h1><p class="muted">Dữ liệu được lưu trực tiếp vào ngân hàng nội dung.</p></div></header>
        <form th:if="${catalog.key == 'questions'}" class="dashboard-panel catalog-preview-form" method="post" enctype="multipart/form-data" th:object="${questionForm}" th:action="${editing ? '/admin/questions/' + entry.id + '/edit' : '/admin/questions'}">
            <h2>Thông tin câu hỏi</h2>
            <div class="field"><label for="content">Nội dung câu hỏi</label><textarea id="content" th:field="*{content}" rows="4" required></textarea></div>
            <div class="field"><label for="instruction">Hướng dẫn</label><textarea id="instruction" th:field="*{instruction}" rows="2"></textarea></div>
            <div class="catalog-form-grid">
                <div class="field"><label for="skill">Kỹ năng</label><select id="skill" th:field="*{skill}"><option th:each="item : ${skills}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="cefrLevel">Cấp độ CEFR</label><select id="cefrLevel" th:field="*{cefrLevel}"><option th:each="item : ${levels}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="questionType">Dạng câu hỏi</label><select id="questionType" th:field="*{questionType}"><option value="SINGLE_CHOICE">Chọn một đáp án</option><option value="MATCHING">Ghép nối</option><option value="ORDERING">Sắp xếp</option><option value="WRITING_TEXT">Trả lời bằng văn bản</option><option value="SPEAKING_AUDIO">Trả lời bằng âm thanh</option></select></div>
                <div class="field"><label for="difficulty">Độ khó</label><input id="difficulty" th:field="*{difficulty}" maxlength="30"></div>
                <div class="field"><label for="partNo">Phần thi</label><input id="partNo" type="number" min="1" th:field="*{partNo}"></div>
                <div class="field"><label for="status">Trạng thái lưu</label><select id="status" th:field="*{status}"><option value="DRAFT">Bản nháp</option><option value="ARCHIVED">Đã lưu trữ</option></select></div>
            </div>
            <section class="catalog-form-section">
                <div class="section-title-row"><h2>Ý hỏi</h2><button class="button button-secondary button-small" type="button" id="add-item">Thêm ý hỏi</button></div>
                <div id="question-items">
                    <div class="question-item-editor" th:each="item, itemStat : *{items}" th:attr="data-item-index=${itemStat.index}">
                        <h3 th:text="|Ý hỏi ${itemStat.index + 1}|">Ý hỏi 1</h3>
                        <div class="field"><label th:for="|items-${itemStat.index}-content|">Nội dung ý hỏi</label><textarea th:id="|items-${itemStat.index}-content|" th:field="*{items[__${itemStat.index}__].content}" rows="3" required></textarea></div>
                        <div class="catalog-form-grid"><div class="field"><label>Vị trí/đáp án đúng</label><input type="number" min="1" th:field="*{items[__${itemStat.index}__].correctPosition}"></div><div class="field"><label>Số từ tối thiểu</label><input type="number" min="0" th:field="*{items[__${itemStat.index}__].minWordCount}"></div><div class="field"><label>Số từ tối đa</label><input type="number" min="0" th:field="*{items[__${itemStat.index}__].maxWordCount}"></div><div class="field"><label>Thời gian trả lời (giây)</label><input type="number" min="1" th:field="*{items[__${itemStat.index}__].responseSeconds}"></div></div>
                        <fieldset class="catalog-option-fields"><legend>Phương án</legend><div th:each="option, optionStat : ${item.options}"><label th:text="|Phương án ${option.code}|" th:for="|items-${itemStat.index}-options-${optionStat.index}-content|"></label><input type="text" th:id="|items-${itemStat.index}-options-${optionStat.index}-content|" th:field="*{items[__${itemStat.index}__].options[__${optionStat.index}__].content}"><label><input type="radio" th:field="*{items[__${itemStat.index}__].correctPosition}" th:value="${optionStat.index + 1}"> Đáp án đúng / vị trí đúng</label><input type="hidden" th:field="*{items[__${itemStat.index}__].options[__${optionStat.index}__].code}"></div></fieldset>
                    </div>
                </div>
            </section>
            <div class="field"><label for="contentFile">Ảnh hoặc âm thanh đính kèm</label><input id="contentFile" name="file" type="file" accept="image/*,audio/*"></div>
            <div class="page-actions"><button class="button" type="submit">Lưu câu hỏi</button><a class="button button-secondary" th:href="@{/admin/questions}">Hủy</a></div>
        </form>
        <form th:if="${catalog.key == 'exams'}" class="dashboard-panel catalog-preview-form" method="post" th:object="${examForm}" th:action="${editing ? '/admin/exams/' + entry.id + '/edit' : '/admin/exams'}">
            <h2>Thông tin đề thi</h2>
            <div class="field"><label for="title">Tên đề thi</label><input id="title" th:field="*{title}" maxlength="255" required></div>
            <div class="field"><label for="description">Mô tả</label><textarea id="description" th:field="*{description}" rows="3"></textarea></div>
            <div class="catalog-form-grid">
                <div class="field"><label for="examType">Loại đề</label><select id="examType" th:field="*{examType}"><option value="PLACEMENT">Kiểm tra đầu vào</option><option value="PRACTICE">Luyện tập</option><option value="CHECKPOINT">Kiểm tra cuối chặng</option><option value="FULL_MOCK">Thi thử tổng hợp</option></select></div>
                <div class="field"><label for="targetLevel">Cấp độ mục tiêu</label><select id="targetLevel" th:field="*{targetLevel}"><option th:each="item : ${levels}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="certificateId">Chứng chỉ</label><select id="certificateId" th:field="*{certificateId}"><option th:each="item : ${certificates}" th:value="${item.id}" th:text="${item.name}"></option></select></div>
                <div class="field"><label for="scoringSchemeId">Bộ chấm điểm</label><select id="scoringSchemeId" th:field="*{scoringSchemeId}"><option th:each="item : ${schemes}" th:value="${item.id}" th:text="${item.name + ' — v' + item.version}"></option></select></div>
                <div class="field"><label for="durationMinutes">Tổng thời gian (phút)</label><input id="durationMinutes" type="number" min="1" th:field="*{durationMinutes}" required></div>
            </div>
            <section class="catalog-form-section"><h2>Section và câu hỏi</h2><div class="catalog-form-grid"><div class="field"><label for="sectionSkill">Kỹ năng section</label><select id="sectionSkill" th:field="*{sectionSkill}"><option th:each="item : ${skills}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label for="sectionDurationMinutes">Thời lượng section (phút)</label><input id="sectionDurationMinutes" type="number" min="1" th:field="*{sectionDurationMinutes}" required></div></div><p class="muted">Chọn câu hỏi đã công bố. Kéo thả để xác định thứ tự làm bài; các câu phải cùng kỹ năng với section.</p><div class="catalog-checkbox" id="exam-question-picker"><label draggable="true" th:each="question : ${publishedQuestions}"><input type="checkbox" name="questionIds" th:value="${question.id}" th:checked="${examForm.questionIds != null and #strings.contains(',' + examForm.questionIds + ',', ',' + question.id + ',')}"><span th:text="${question.id + ' · ' + question.skill + ' · ' + question.content}"></span></label></div></section>
            <div class="page-actions"><button class="button" type="submit">Lưu đề thi</button><a class="button button-secondary" th:href="@{/admin/exams}">Hủy</a></div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
(() => {
  const root = document.getElementById('question-items');
  const add = document.getElementById('add-item');
  if (!root || !add) return;
  add.addEventListener('click', () => {
    const index = root.querySelectorAll('.question-item-editor').length;
    const block = document.createElement('div');
    block.className = 'question-item-editor';
    block.dataset.itemIndex = index;
    block.innerHTML = `<h3>Ý hỏi ${index + 1}</h3>
      <div class="field"><label>Nội dung ý hỏi</label><textarea name="items[${index}].content" rows="3" required></textarea></div>
      <div class="catalog-form-grid"><div class="field"><label>Vị trí/đáp án đúng</label><input type="number" min="1" name="items[${index}].correctPosition"></div><div class="field"><label>Số từ tối thiểu</label><input type="number" min="0" name="items[${index}].minWordCount"></div><div class="field"><label>Số từ tối đa</label><input type="number" min="0" name="items[${index}].maxWordCount"></div><div class="field"><label>Thời gian trả lời (giây)</label><input type="number" min="1" name="items[${index}].responseSeconds"></div></div>
      <fieldset class="catalog-option-fields"><legend>Phương án</legend>${['A','B','C'].map((code, optionIndex) => `<div><label>Phương án ${code}</label><input type="text" name="items[${index}].options[${optionIndex}].content"><label><input type="radio" name="items[${index}].correctPosition" value="${optionIndex + 1}"> Đáp án đúng / vị trí đúng</label><input type="hidden" name="items[${index}].options[${optionIndex}].code" value="${code}"></div>`).join('')}</fieldset>`;
    root.appendChild(block);
  });
})();
(() => {
  const picker = document.getElementById('exam-question-picker');
  if (!picker) return;
  let dragged;
  picker.querySelectorAll('label[draggable="true"]').forEach(label => {
    label.addEventListener('dragstart', () => { dragged = label; label.classList.add('dragging'); });
    label.addEventListener('dragend', () => { label.classList.remove('dragging'); dragged = null; });
    label.addEventListener('dragover', event => {
      event.preventDefault();
      if (dragged && dragged !== label) picker.insertBefore(dragged, label);
    });
  });
})();
</script>
</body></html>
