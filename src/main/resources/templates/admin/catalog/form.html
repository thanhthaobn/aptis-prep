<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${catalog.title})}"></head>
<body class="admin-theme">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container ap-container app-shell">
    <div th:replace="~{fragments/admin-sidebar :: adminSidebar(${catalog.key})}"></div>
    <main id="main-content" tabindex="-1" class="app-main admin-catalog">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb(${catalog.title}, @{${catalog.baseUrl()}}, ${editing ? 'Chỉnh sửa' : catalog.createLabel})}"></div>
        <header class="page-header"><div><h1 th:text="${editing ? 'Chỉnh sửa ' + catalog.singular : catalog.createLabel}"></h1><p class="muted">Dữ liệu được lưu trực tiếp vào ngân hàng nội dung.</p></div></header>
        <form th:if="${catalog.key == 'questions'}" class="dashboard-panel catalog-preview-form" method="post" enctype="multipart/form-data" th:object="${questionForm}" th:action="${editing ? '/admin/questions/' + entry.id + '/edit' : '/admin/questions'}">
            <h2>Thông tin câu hỏi</h2>
            <div class="field"><label for="content">Nội dung câu hỏi</label><textarea id="content" th:field="*{content}" rows="4" required></textarea></div>
            <div class="field"><label for="instruction">Hướng dẫn</label><textarea id="instruction" th:field="*{instruction}" rows="2"></textarea></div>
            <div class="field" id="reading-passage-field"><label for="readingPassage">Đoạn văn Reading (chỉ dùng cho kỹ năng Reading)</label><textarea id="readingPassage" th:field="*{readingPassage}" rows="10" placeholder="Dán đoạn văn nguồn tại đây. Xuống dòng sẽ được giữ khi hiển thị cho học viên."></textarea></div>
            <div class="catalog-form-grid">
                <div class="field"><label for="skill">Kỹ năng</label><select id="skill" th:field="*{skill}"><option th:each="item : ${skills}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="cefrLevel">Cấp độ CEFR</label><select id="cefrLevel" th:field="*{cefrLevel}"><option th:each="item : ${levels}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="questionType">Dạng câu hỏi</label><select id="questionType" th:field="*{questionType}"><option value="SINGLE_CHOICE">Chọn một đáp án</option><option value="MATCHING">Ghép nối</option><option value="ORDERING">Sắp xếp</option><option value="WRITING_TEXT">Trả lời bằng văn bản</option><option value="SPEAKING_AUDIO">Trả lời bằng âm thanh</option></select></div>
                <div class="field"><label for="difficulty">Độ khó</label><input id="difficulty" th:field="*{difficulty}" maxlength="30"></div>
                <div class="field"><label for="partNo">Phần thi</label><input id="partNo" type="number" min="1" th:field="*{partNo}"></div>
                <div class="field"><label for="status">Trạng thái lưu</label><select id="status" th:field="*{status}"><option value="DRAFT">Bản nháp</option><option value="ARCHIVED">Đã lưu trữ</option></select></div>
            </div>
            <section class="catalog-form-section">
                <div class="section-title-row"><h2>Các mục câu hỏi</h2><button class="button button-secondary button-small" type="button" id="add-item">Thêm mục</button></div>
                <div id="question-items">
                    <div class="question-item-editor" th:each="item, itemStat : *{items}" th:attr="data-item-index=${itemStat.index}">
                        <h3 class="question-item-editor-title"><span class="question-item-editor-number" th:text="${itemStat.index + 1}">1</span><span class="sr-only">Mục câu hỏi</span></h3>
                        <div class="field"><label th:for="|items-${itemStat.index}-content|">Nội dung mục câu hỏi</label><textarea th:id="|items-${itemStat.index}-content|" th:field="*{items[__${itemStat.index}__].content}" rows="3" required></textarea></div>
                        <div class="catalog-form-grid"><div class="field"><label>Vị trí/đáp án đúng</label><input type="number" min="1" th:field="*{items[__${itemStat.index}__].correctPosition}"></div><div class="field"><label>Số từ tối thiểu</label><input type="number" min="0" th:field="*{items[__${itemStat.index}__].minWordCount}"></div><div class="field"><label>Số từ tối đa</label><input type="number" min="0" th:field="*{items[__${itemStat.index}__].maxWordCount}"></div><div class="field"><label>Thời gian trả lời (giây)</label><input type="number" min="1" th:field="*{items[__${itemStat.index}__].responseSeconds}"></div></div>
                        <fieldset class="catalog-option-fields"><legend>Phương án</legend><div th:each="option, optionStat : ${item.options}"><label th:text="|Phương án ${option.code}|" th:for="|items-${itemStat.index}-options-${optionStat.index}-content|"></label><input type="text" th:id="|items-${itemStat.index}-options-${optionStat.index}-content|" th:field="*{items[__${itemStat.index}__].options[__${optionStat.index}__].content}"><label><input type="radio" th:field="*{items[__${itemStat.index}__].correctPosition}" th:value="${optionStat.index + 1}"> Đáp án đúng / vị trí đúng</label><input type="hidden" th:field="*{items[__${itemStat.index}__].options[__${optionStat.index}__].code}"></div></fieldset>
                    </div>
                </div>
            </section>
            <div class="field"><label for="contentFile">Ảnh hoặc âm thanh đính kèm</label><input id="contentFile" name="file" type="file" accept="image/*,audio/*"></div>
            <div class="page-actions"><button class="button" type="submit">Lưu câu hỏi</button><a class="button button-secondary" th:href="@{/admin/questions}">Hủy</a></div>
        </form>
        <form th:if="${catalog.key == 'exams'}" class="dashboard-panel catalog-preview-form" method="post" th:object="${examForm}" th:action="${editing ? '/admin/exams/' + entry.id + '/edit' : '/admin/exams'}">
            <h2>Thông tin đề thi</h2>
            <div class="field"><label for="title">Tên đề thi</label><input id="title" th:field="*{title}" maxlength="255" required></div>
            <div class="field"><label for="description">Mô tả</label><textarea id="description" th:field="*{description}" rows="3"></textarea></div>
            <div class="catalog-form-grid">
                <div class="field"><label for="examType">Loại đề</label><select id="examType" th:field="*{examType}"><option value="PLACEMENT">Kiểm tra đầu vào</option><option value="PRACTICE">Luyện tập</option><option value="CHECKPOINT">Kiểm tra cuối chặng</option><option value="FULL_MOCK">Thi thử tổng hợp</option></select></div>
                <div class="field"><label for="targetLevel">Cấp độ mục tiêu</label><select id="targetLevel" th:field="*{targetLevel}"><option value="">Không đặt (trừ Checkpoint)</option><option th:each="item : ${levels}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="certificateId">Chứng chỉ</label><select id="certificateId" th:field="*{certificateId}"><option th:each="item : ${certificates}" th:value="${item.id}" th:text="${item.name}"></option></select></div>
                <div class="field"><label for="scoringSchemeId">Bộ chấm điểm</label><select id="scoringSchemeId" th:field="*{scoringSchemeId}"><option value="">Không quy đổi CEFR (chỉ điểm raw)</option><option th:each="item : ${schemes}" th:value="${item.id}" th:text="${item.name + ' — v' + item.version}"></option></select></div>
                <div class="field"><label for="durationMinutes">Tổng thời gian (phút)</label><input id="durationMinutes" type="number" min="1" th:field="*{durationMinutes}" required></div>
            </div>
            <section class="catalog-form-section"><div class="section-title-row"><h2>Sections và câu hỏi</h2><button class="button button-secondary button-small" type="button" id="add-exam-section">Thêm section</button></div><p class="muted">Full Mock có thể gồm nhiều kỹ năng. Mỗi câu hỏi chỉ được đưa vào đúng một section.</p><div id="exam-sections"><div class="exam-section-editor" th:each="section, sectionStat : *{sections}" th:attr="data-section-index=${sectionStat.index}"><h3 class="exam-section-title"><span class="exam-section-number" th:text="${sectionStat.index + 1}">1</span><span>Section</span></h3><div class="catalog-form-grid"><div class="field"><label th:for="|sections-${sectionStat.index}-skill|">Kỹ năng section</label><select class="section-skill" th:id="|sections-${sectionStat.index}-skill|" th:field="*{sections[__${sectionStat.index}__].skill}"><option th:each="item : ${skills}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label th:for="|sections-${sectionStat.index}-durationMinutes|">Thời lượng section (phút)</label><input type="number" min="1" required th:id="|sections-${sectionStat.index}-durationMinutes|" th:field="*{sections[__${sectionStat.index}__].durationMinutes}"></div></div><input type="hidden" class="section-question-ids" th:field="*{sections[__${sectionStat.index}__].questionIds}"><div class="catalog-checkbox section-question-picker"><label class="section-question-label" draggable="true" th:each="question : ${publishedQuestions}" th:attr="data-skill=${question.skill}" th:hidden="${question.skill != section.skill}"><input type="checkbox" class="section-question" th:attr="data-question-id=${question.id},data-section-index=${sectionStat.index},data-skill=${question.skill}" th:checked="${section.questionIds != null and #strings.contains(',' + section.questionIds + ',', ',' + question.id + ',')}"><span th:text="${question.id + ' · ' + question.skill + ' · ' + question.content}"></span></label></div></div></div></section>
            <div class="page-actions"><button class="button" type="submit">Lưu đề thi</button><a class="button button-secondary" th:href="@{/admin/exams}">Hủy</a></div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
(() => {
  const root = document.getElementById('question-items');
  const add = document.getElementById('add-item');
  if (!root || !add) return;
  const updateQuestionType = () => {
    const type = document.getElementById('questionType').value;
    root.querySelectorAll('.catalog-option-fields').forEach(field => {
      const visible = ['SINGLE_CHOICE','MATCHING'].includes(type); field.hidden = !visible; field.disabled = !visible;
    });
  };
  document.getElementById('questionType').addEventListener('change', updateQuestionType);
  updateQuestionType();
  add.addEventListener('click', () => {
    const index = root.querySelectorAll('.question-item-editor').length;
    const block = document.createElement('div');
    block.className = 'question-item-editor';
    block.dataset.itemIndex = index;
    block.innerHTML = `<h3 class="question-item-editor-title"><span class="question-item-editor-number">${index + 1}</span><span class="sr-only">Mục câu hỏi</span></h3>
      <div class="field"><label>Nội dung mục câu hỏi</label><textarea name="items[${index}].content" rows="3" required></textarea></div>
      <div class="catalog-form-grid"><div class="field"><label>Vị trí/đáp án đúng</label><input type="number" min="1" name="items[${index}].correctPosition"></div><div class="field"><label>Số từ tối thiểu</label><input type="number" min="0" name="items[${index}].minWordCount"></div><div class="field"><label>Số từ tối đa</label><input type="number" min="0" name="items[${index}].maxWordCount"></div><div class="field"><label>Thời gian trả lời (giây)</label><input type="number" min="1" name="items[${index}].responseSeconds"></div></div>
      <fieldset class="catalog-option-fields"><legend>Phương án</legend>${['A','B','C'].map((code, optionIndex) => `<div><label>Phương án ${code}</label><input type="text" name="items[${index}].options[${optionIndex}].content"><label><input type="radio" name="items[${index}].correctPosition" value="${optionIndex + 1}"> Đáp án đúng / vị trí đúng</label><input type="hidden" name="items[${index}].options[${optionIndex}].code" value="${code}"></div>`).join('')}</fieldset>`;
    root.appendChild(block);
    updateQuestionType();
  });
})();
(() => {
  const sections = document.getElementById('exam-sections');
  const add = document.getElementById('add-exam-section');
  const renumberSections = () => sections?.querySelectorAll('.exam-section-editor').forEach((section, index) => {
    section.dataset.sectionIndex = index;
    const number = section.querySelector('.exam-section-number');
    if (number) number.textContent = String(index + 1);
  });
  const sync = () => sections?.querySelectorAll('.exam-section-editor').forEach(section => {
    const values = [...section.querySelectorAll('.section-question:checked')].map(input => input.dataset.questionId);
    section.querySelector('.section-question-ids').value = values.join(',');
  });
  const updateQuestionVisibility = section => {
    const skill = section.querySelector('.section-skill')?.value;
    section.querySelectorAll('.section-question-label').forEach(label => {
      const input = label.querySelector('.section-question');
      const visible = label.dataset.skill === skill;
      label.hidden = !visible;
      if (!visible && input) input.checked = false;
    });
  };
  sections?.querySelectorAll('.exam-section-editor').forEach(updateQuestionVisibility);
  sections?.addEventListener('change', event => {
    const section = event.target.closest('.exam-section-editor');
    if (section && event.target.matches('.section-skill')) updateQuestionVisibility(section);
    sync();
  });
  document.getElementById('exam-sections')?.closest('form')?.addEventListener('submit', sync);
  add?.addEventListener('click', () => {
    const index = sections.querySelectorAll('.exam-section-editor').length;
    const source = sections.querySelector('.exam-section-editor');
    const clone = source.cloneNode(true);
    clone.dataset.sectionIndex = index;
    clone.querySelectorAll('[id]').forEach(node => node.id = node.id.replace(/sections-\\d+-/, `sections-${index}-`));
    clone.querySelectorAll('[for]').forEach(node => node.htmlFor = node.htmlFor.replace(/sections-\\d+-/, `sections-${index}-`));
    clone.querySelectorAll('[name]').forEach(node => node.name = node.name.replace(/sections\\[\\d+\\]/g, `sections[${index}]`));
    clone.querySelector('.section-question-ids').value = '';
    clone.querySelectorAll('.section-question').forEach(input => { input.checked = false; input.dataset.sectionIndex = index; });
    sections.appendChild(clone);
    renumberSections();
    updateQuestionVisibility(clone);
  });
})();
</script>
</body></html>
