spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=aptisprep_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Allow migrations introduced by merged branches after later versions were applied.
spring.flyway.out-of-order=true

# Bat khi da co API key rieng; file application-dev.properties khong commit.
app.ai.enabled=false
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.grading-model=gpt-4.1-mini
app.ai.transcription-model=gpt-4o-mini-transcribe
