<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Quên mật khẩu')}"></head>
  <body class="landing-theme">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main id="main-content" tabindex="-1" class="auth-page">
      <section class="form-card">
        <div th:replace="~{fragments/back-link :: backLink(@{/login})}"></div>
        <h1>Quên mật khẩu</h1>
        <p>
          Nhận liên kết đặt lại mật khẩu qua email. Liên kết có hiệu lực 15 phút và hết hiệu lực sau
          khi đổi mật khẩu.
        </p>
        <p class="alert alert-info" role="status" th:if="${requested == true}">
          Nếu email thuộc tài khoản đang hoạt động, hệ thống sẽ gửi hướng dẫn. Hãy kiểm tra cả thư
          rác.
        </p>
        <p class="alert alert-info" th:unless="${recoveryAvailable}">
          Khôi phục qua email chưa được cấu hình. Vui lòng liên hệ quản trị viên.
        </p>
        <form
          th:if="${recoveryAvailable}"
          th:action="@{/forgot-password}"
          method="post"
          th:object="${recoveryForm}"
        >
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <p
            role="alert"
            th:each="message : ${display.globalErrors('recoveryForm')}"
            th:text="${message}"
          ></p>
          <div class="field">
            <label for="recoveryEmail">Email tài khoản</label>
            <input
              id="recoveryEmail"
              th:field="*{email}"
              type="email"
              autocomplete="email"
              maxlength="255"
              required
              aria-describedby="recovery-email-error"
            />
            <span id="recovery-email-error" class="field-error" th:errors="*{email}"></span>
          </div>
          <button class="button" type="submit">Gửi liên kết đặt lại</button>
        </form>
        <p></p>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
