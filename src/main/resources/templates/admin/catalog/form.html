<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${catalog.title})}"></head>
<body class="admin-theme">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container app-shell">
    <div th:replace="~{fragments/admin-sidebar :: adminSidebar(${catalog.key})}"></div>
    <main class="app-main admin-catalog">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb(${catalog.title}, @{${catalog.baseUrl()}}, ${editing ? 'Chỉnh sửa' : catalog.createLabel})}"></div>
        <header class="page-header"><div><h1 th:text="${editing ? 'Chỉnh sửa ' + catalog.singular : catalog.createLabel}"></h1><p class="muted">Dữ liệu được lưu trực tiếp vào ngân hàng nội dung.</p></div></header>
        <form th:if="${catalog.key == 'questions'}" class="dashboard-panel catalog-preview-form" method="post" enctype="multipart/form-data" th:object="${questionForm}" th:action="${editing ? '/admin/questions/' + entry.id + '/edit' : '/admin/questions'}">
            <h2>Thông tin câu hỏi</h2>
            <div class="field"><label for="content">Nội dung câu hỏi</label><textarea id="content" th:field="*{content}" rows="4" required></textarea></div>
            <div class="field"><label for="instruction">Hướng dẫn</label><textarea id="instruction" th:field="*{instruction}" rows="2"></textarea></div>
            <div class="catalog-form-grid">
                <div class="field"><label for="skill">Kỹ năng</label><select id="skill" th:field="*{skill}"><option th:each="item : ${skills}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="cefrLevel">Cấp độ CEFR</label><select id="cefrLevel" th:field="*{cefrLevel}"><option th:each="item : ${levels}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="questionType">Dạng câu hỏi</label><select id="questionType" th:field="*{questionType}"><option value="SINGLE_CHOICE">Chọn một đáp án</option><option value="MATCHING">Ghép nối</option><option value="ORDERING">Sắp xếp</option><option value="WRITING_TEXT">Trả lời bằng văn bản</option><option value="SPEAKING_AUDIO">Trả lời bằng âm thanh</option></select></div>
                <div class="field"><label for="difficulty">Độ khó</label><input id="difficulty" th:field="*{difficulty}" maxlength="30"></div>
                <div class="field"><label for="partNo">Phần thi</label><input id="partNo" type="number" min="1" th:field="*{partNo}"></div>
                <div class="field"><label for="status">Trạng thái lưu</label><select id="status" th:field="*{status}"><option value="DRAFT">Bản nháp</option><option value="ARCHIVED">Đã lưu trữ</option></select></div>
            </div>
            <section class="catalog-form-section"><h2>Ý hỏi</h2><div class="field"><label for="itemContent">Nội dung ý hỏi</label><textarea id="itemContent" th:field="*{itemContent}" rows="3" required></textarea></div><div class="catalog-form-grid"><div class="field"><label for="minWordCount">Số từ tối thiểu</label><input id="minWordCount" type="number" min="0" th:field="*{minWordCount}"></div><div class="field"><label for="maxWordCount">Số từ tối đa</label><input id="maxWordCount" type="number" min="0" th:field="*{maxWordCount}"></div><div class="field"><label for="responseSeconds">Thời gian trả lời (giây)</label><input id="responseSeconds" type="number" min="1" th:field="*{responseSeconds}"></div></div></section>
            <fieldset class="catalog-option-fields"><legend>Phương án — dùng cho Chọn một / Ghép nối / Sắp xếp</legend><div th:each="option, stat : *{options}"><label th:for="|option-${stat.index}|" th:text="|Phương án ${option.code}|"></label><input th:id="|option-${stat.index}|" th:field="*{options[__${stat.index}__].content}" type="text"><label><input type="radio" th:field="*{correctPosition}" th:value="${stat.index + 1}"> Đáp án đúng / vị trí đúng</label><input type="hidden" th:field="*{options[__${stat.index}__].code}"></div></fieldset>
            <div class="field"><label for="contentFile">Ảnh hoặc âm thanh đính kèm</label><input id="contentFile" name="file" type="file" accept="image/*,audio/*"></div>
            <div class="page-actions"><button class="button" type="submit">Lưu câu hỏi</button><a class="button button-secondary" th:href="@{/admin/questions}">Hủy</a></div>
        </form>
        <form th:if="${catalog.key == 'exams'}" class="dashboard-panel catalog-preview-form" method="post" th:object="${examForm}" th:action="${editing ? '/admin/exams/' + entry.id + '/edit' : '/admin/exams'}">
            <h2>Thông tin đề thi</h2>
            <div class="field"><label for="title">Tên đề thi</label><input id="title" th:field="*{title}" maxlength="255" required></div>
            <div class="field"><label for="description">Mô tả</label><textarea id="description" th:field="*{description}" rows="3"></textarea></div>
            <div class="catalog-form-grid">
                <div class="field"><label for="examType">Loại đề</label><select id="examType" th:field="*{examType}"><option value="PLACEMENT">Kiểm tra đầu vào</option><option value="PRACTICE">Luyện tập</option><option value="CHECKPOINT">Kiểm tra cuối chặng</option><option value="FULL_MOCK">Thi thử tổng hợp</option></select></div>
                <div class="field"><label for="targetLevel">Cấp độ mục tiêu</label><select id="targetLevel" th:field="*{targetLevel}"><option th:each="item : ${levels}" th:value="${item}" th:text="${item}"></option></select></div>
                <div class="field"><label for="certificateId">Chứng chỉ</label><select id="certificateId" th:field="*{certificateId}"><option th:each="item : ${certificates}" th:value="${item.id}" th:text="${item.name}"></option></select></div>
                <div class="field"><label for="scoringSchemeId">Bộ chấm điểm</label><select id="scoringSchemeId" th:field="*{scoringSchemeId}"><option th:each="item : ${schemes}" th:value="${item.id}" th:text="${item.name + ' — v' + item.version}"></option></select></div>
                <div class="field"><label for="durationMinutes">Tổng thời gian (phút)</label><input id="durationMinutes" type="number" min="1" th:field="*{durationMinutes}" required></div>
            </div>
            <section class="catalog-form-section"><h2>Section và câu hỏi</h2><div class="catalog-form-grid"><div class="field"><label for="sectionSkill">Kỹ năng section</label><select id="sectionSkill" th:field="*{sectionSkill}"><option th:each="item : ${skills}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label for="sectionDurationMinutes">Thời lượng section (phút)</label><input id="sectionDurationMinutes" type="number" min="1" th:field="*{sectionDurationMinutes}" required></div></div><p class="muted">Chọn các câu hỏi đã công bố. Các câu phải cùng kỹ năng với section.</p><div class="catalog-checkbox"><label th:each="question : ${publishedQuestions}"><input type="checkbox" name="questionIds" th:value="${question.id}" th:checked="${examForm.questionIds != null and #strings.contains(',' + examForm.questionIds + ',', ',' + question.id + ',')}"><span th:text="${question.id + ' · ' + question.skill + ' · ' + question.content}"></span></label></div></section>
            <div class="page-actions"><button class="button" type="submit">Lưu đề thi</button><a class="button button-secondary" th:href="@{/admin/exams}">Hủy</a></div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body></html>
