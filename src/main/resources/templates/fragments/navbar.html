<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="navbar">
    <div class="container nav-wrap">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 19V7.5L12 4l7 3.5V19"/><path d="M8.5 10.5 12 12l3.5-1.5M12 12v8"/></svg></span>
            <span>AptisPrep</span>
        </a>
        <nav class="nav-links" aria-label="Điều hướng chính">
            <a th:href="@{/}" th:classappend="${navSection == 'home'} ? 'active'" th:attr="aria-current=${navSection == 'home' ? 'page' : null}">Trang chủ</a>
            <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/dashboard}" th:classappend="${navSection == 'student'} ? 'active'" th:attr="aria-current=${navSection == 'student' ? 'page' : null}">Học tập</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" th:classappend="${navSection == 'admin'} ? 'active'" th:attr="aria-current=${navSection == 'admin' ? 'page' : null}">Quản trị</a>
            <a sec:authorize="isAnonymous()" th:href="@{/login}" th:classappend="${navSection == 'login'} ? 'active'" th:attr="aria-current=${navSection == 'login' ? 'page' : null}">Đăng nhập</a>
            <a sec:authorize="isAnonymous()" class="button button-small" th:href="@{/register}" th:classappend="${navSection == 'register'} ? 'active'" th:attr="aria-current=${navSection == 'register' ? 'page' : null}">Đăng ký</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <button class="button button-secondary button-small" type="submit">Đăng xuất</button>
            </form>
        </nav>
    </div>
</header>
</body>
</html>
