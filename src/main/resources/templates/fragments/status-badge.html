<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block
      th:fragment="statusBadge(status)"
      th:switch="${status == null ? null : status.toString()}"
    >
      <span th:case="'COMPLETED'" class="badge badge-success">Đã hoàn thành</span>

      <span th:case="'GRADING'" class="badge badge-warning">Đang chấm điểm</span>

      <span th:case="'GRADING_FAILED'" class="badge badge-danger">Chấm chưa thành công</span>

      <span th:case="'PENDING'" class="badge badge-warning">Đang chờ xử lý</span>

      <span th:case="'ERROR'" class="badge badge-danger">Lỗi xử lý</span>

      <span th:case="'DRAFT'" class="badge">Bản nháp</span>

      <span th:case="'PUBLISHED'" class="badge badge-success">Đã công bố</span>

      <span th:case="'ARCHIVED'" class="badge">Đã lưu trữ</span>

      <span th:case="'ACTIVE'" class="badge badge-success">Đang hoạt động</span>

      <span th:case="'LOCKED'" class="badge badge-danger">Đã khóa</span>

      <span th:case="'INACTIVE'" class="badge">Ngừng hoạt động</span>

      <span th:case="*" th:if="${status != null}" class="badge" th:text="${status}"></span>
    </th:block>

    <th:block th:fragment="statusText(status)">
      <span th:switch="${status == null ? null : status.toString()}">
        <span th:case="'COMPLETED'">Đã hoàn thành</span>
        <span th:case="'GRADING'">Đang chấm điểm</span>
        <span th:case="'GRADING_FAILED'">Chấm chưa thành công</span>
        <span th:case="'PENDING'">Đang chờ xử lý</span>
        <span th:case="'ERROR'">Lỗi xử lý</span>
        <span th:case="'DRAFT'">Bản nháp</span>
        <span th:case="'PUBLISHED'">Đã công bố</span>
        <span th:case="'ARCHIVED'">Đã lưu trữ</span>
        <span th:case="'ACTIVE'">Đang hoạt động</span>
        <span th:case="'LOCKED'">Đã khóa</span>
        <span th:case="'INACTIVE'">Ngừng hoạt động</span>
        <span th:case="*" th:text="${status}"></span>
      </span>
    </th:block>
  </body>
</html>
