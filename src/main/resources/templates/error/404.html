<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AptisPrep - Nền tảng luyện thi Aptis chuẩn CEFR (Reading, Listening, Writing, Speaking) với lộ trình cá nhân hóa và chấm điểm thông minh."

    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/learning-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/navi.css}" />
    <link rel="stylesheet" th:href="@{/css/exam.css}" />
    <link rel="stylesheet" th:href="@{/css/result.css}" />
    <link rel="stylesheet" th:href="@{/css/catalog-compact.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-overview.css}" />
    <link rel="stylesheet" th:href="@{/css/typography.css}" />
    <script th:src="@{/js/app-dialog.js}" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"

    ></script>

  <body>
    <main
      id="main-content"
      tabindex="-1"
      class="container ap-container narrow page-content error-page"
    >
      <div class="form-card">
        <figure class="navi navi-help">
          <svg viewBox="0 0 160 130" role="img" aria-label="Navi đang giúp bạn tìm lại đường đi">
            <path
              class="navi-shadow"
              d="M36 118c0-8 21-14 46-14s46 6 46 14-21 10-46 10-46-2-46-10Z"
            ></path>
            <path
              class="navi-body"
              d="M43 68c0-29 17-48 40-48s42 19 42 48c0 32-13 48-42 48S43 100 43 68Z"
            ></path>
            <path class="navi-antenna" d="M82 21V9m0 0 9-5"></path>
            <circle class="navi-eye" cx="67" cy="63" r="5"></circle>
            <circle class="navi-eye" cx="99" cy="63" r="5"></circle>
            <path class="navi-mouth" d="M72 79c6 6 15 6 22 0"></path>
            <path class="navi-arm navi-arm-left" d="M46 73 25 61"></path>
            <path class="navi-arm navi-arm-right" d="m122 73 19-17"></path>
            <path
              class="navi-question"
              d="M136 20c0-8 13-9 13 0 0 5-6 5-6 10m0 7h.01"
              aria-hidden="true"
            ></path>
          </svg>
          <figcaption>Navi đang giúp bạn tìm lại đường đi</figcaption>
        </figure>
        <h1>Không tìm thấy nội dung</h1>
        <p th:text="${message}">Nội dung không tồn tại.</p>
        <a class="button" th:href="@{/}">Về trang chủ</a>
      </div>
    </main>
  </body>
</html>
