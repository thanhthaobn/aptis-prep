<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head(${attempt.title})}"></head>
  <body
    class="student-theme exam-page"
    th:classappend="${(attempt.examType == 'FULL_MOCK' or (attempt.examType == 'PLACEMENT' and attempt.sectionSkill != null))} ? ' full-mock-exam'"
  >
    <!-- Non-JS Fallback: hiển thị tất cả các câu hỏi. -->
    <noscript>
      <style>
        .exam-question-card {
          display: block !important;
        }
        .exam-palette-panel,
        .exam-runner-header .exam-timer-badge,
        .btn-toggle-palette-drawer,
        #btn-open-submit-modal,
        .question-nav-bar {
          display: none !important;
        }
      </style>
    </noscript>

    <style>
      .question-instruction {
        margin: 0 0 1.35rem;
        color: #58708f;
        font-size: var(--text-base);
        line-height: 1.7;
        letter-spacing: normal;
      }
      .reading-passage {
        margin: 1.5rem 0 1.75rem;
        padding: 1.25rem 1.4rem;
        border: 1px solid #c8dce5;
        border-left: 5px solid #087a9d;
        border-radius: var(--radius);
        background: #f2fbfd;
      }
      .reading-passage h3 {
        margin: 0 0 0.7rem;
        color: #075c78;
        font-size: var(--text-base);
        line-height: 1.45;
      }
      .reading-passage-text {
        white-space: pre-line;
        line-height: 1.8;
        letter-spacing: normal;
        color: #263b50;
      }
      .media-player {
        display: grid;
        gap: 0.7rem;
        margin: 1.25rem 0 1.5rem;
        padding: 1rem 1.1rem;
        border: 1px solid #c8dce5;
        border-radius: var(--radius);
        background: #f2fbfd;
      }
      .media-audio {
        width: 100%;
        height: 42px;
        accent-color: #087a9d;
      }
      .media-audio-shell {
        position: relative;
      }
      .media-play-trigger {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        width: 58px;
        height: 42px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .media-play-trigger:disabled {
        cursor: not-allowed;
      }
      .media-status {
        min-height: 1.1rem;
        font-size: var(--text-small);
      }
      .attempt-media > img {
        display: block;
        width: min(100%, 760px);
        max-height: 420px;
        margin: 1.25rem 0 1.5rem;
        object-fit: contain;
        border: 1px solid #c8dce5;
        border-radius: var(--radius);
        background: #f7fbfc;
        box-shadow: 0 8px 20px rgba(34, 73, 96, 0.08);
      }
      .question-item {
        margin-top: 1.25rem;
        padding: 1.45rem 1.5rem 1.55rem;
        border: 1px solid #dbe7ee;
        border-radius: var(--radius);
        background: linear-gradient(145deg, #ffffff, #f8fbfd);
        box-shadow: 0 8px 22px rgba(34, 73, 96, 0.06);
      }
      .question-item:first-of-type {
        margin-top: 1.5rem;
      }
      .question-item-header {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }
      .question-item-number {
        display: grid;
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        place-items: center;
        margin-top: 0.05rem;
        color: #fff;
        background: linear-gradient(135deg, #087a9d, #0f8a78);
        border-radius: 10px;
        box-shadow: 0 5px 12px rgba(8, 122, 157, 0.2);
        font-size: var(--text-base);
        font-weight: 800;
      }
      .question-item-prompt {
        margin: 0.25rem 0 0;
        color: #20364d;
        font-size: var(--text-base);
        font-weight: 700;
        line-height: 1.7;
        letter-spacing: normal;
        word-spacing: 0.035em;
      }
      .question-item .field {
        margin-top: 0;
      }
      .question-item .field label {
        margin-bottom: 0.45rem;
        color: #50657b;
        font-size: var(--text-small);
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .question-item textarea {
        min-height: 150px;
        resize: vertical;
        border-color: #cbdce5;
        background: #fff;
        line-height: 1.65;
      }
      .question-item textarea:focus {
        border-color: #087a9d;
        box-shadow: 0 0 0 3px rgba(8, 122, 157, 0.12);
      }
      .question-item .answer-form {
        margin: 0;
      }
      .question-item .button {
        margin-top: 0.9rem;
      }
      .question-item .autosave-status {
        display: inline-block;
        margin-left: 0.65rem;
        font-size: var(--text-small);
      }
      .speaking-recorder {
        display: block;
        margin: 0;
        padding: 1rem;
        border: 1px solid #dbe7ee;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.78);
      }
      .speaking-recorder-label {
        display: block;
        margin-bottom: 0.65rem;
        color: #50657b;
        font-size: var(--text-small);
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .speaking-recorder-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
      }
      .speaking-recorder-actions .button {
        margin: 0;
        width: auto;
        min-width: 84px;
        min-height: 36px;
        padding: 0.4rem 0.6rem;
        font-size: var(--text-small);
        border-radius: var(--radius);
        white-space: nowrap;
      }
      .speaking-recorder .recording-status {
        display: block;
        grid-column: 1 / -1;
        height: 3em;
        overflow: auto;
        margin: 0.15rem 0 0;
        font-size: var(--text-small);
      }
      .recording-meter {
        grid-column: 1 / -1;
        display: grid;
        gap: 0.45rem;
        flex: 1 1 100%;
        margin-top: 0.35rem;
        padding: 0.75rem 0.85rem;
        border: 1px solid #c8dce5;
        border-radius: var(--radius);
        background: #f2fbfd;
      }
      .recording-meter-heading {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: #075c78;
        font-size: var(--text-small);
        font-weight: 800;
      }
      .recording-meter progress {
        width: 100%;
        height: 0.7rem;
        accent-color: #087a9d;
      }
      .speaking-recorder .recording-preview {
        width: min(100%, 460px);
        height: 42px;
        margin-top: 0.85rem;
      }
      .recording-preview.is-empty {
        visibility: hidden;
        pointer-events: none;
      }
      .speaking-recorder .recording-preview {
        display: block;
        width: 100%;
      }
      .full-mock-exam.pagination-ready .full-mock-question:not(.is-active) {
        display: none;
      }
      .full-mock-question {
        scroll-margin-top: 7.5rem;
      }
      .full-mock-pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-top: 1.25rem;
        padding: 0.9rem 0;
      }
      .full-mock-pagination-info {
        color: #58708f;
        font-size: var(--text-small);
        font-weight: 700;
        text-align: center;
      }
      @media (max-width: 560px) {
        .question-item {
          padding: 1rem;
        }
        .question-item-prompt {
          font-size: var(--text-base);
        }
        .question-item .autosave-status {
          display: block;
          margin: 0.6rem 0 0;
        }
      }
    </style>

    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container exam-workspace">
      <aside class="exam-control-panel" aria-label="Thông tin bài thi">
        <div
          class="exam-control-heading"
          th:text="${attempt.sectionSkill == null ? 'Bài thi' : display.catalogSkill(attempt.sectionSkill)}"
        >
          Bài thi
        </div>
        <div
          class="exam-timer-badge"
          id="exam-timer"
          th:if="${attempt.deadline != null}"
          th:attr="data-deadline=${attempt.deadline},data-next-section=${attempt.nextSection},data-section-seconds=${attempt.sectionSkill == null ? null : attempt.remainingSeconds}"
        >
          Còn
          <strong id="timer-display">--:--</strong>
        </div>
        <nav
          class="exam-section-navigation"
          th:if="${attempt.sections != null and attempt.sections.size() > 1}"
          aria-label="Các phần thi"
        >
          <h2>Các phần thi</h2>
          <ol class="exam-section-list">
            <li
              th:each="section : ${attempt.sections}"
              th:classappend="${section.open ? ' is-current' : (section.state == 'COMPLETED' ? ' is-completed' : ' is-upcoming')}"
            >
              <div class="exam-section-link">
                <span>
                  <strong
                    th:text="${'Phần ' + (section.index + 1) + ' · ' + display.catalogSkill(section.skill)}"
                  ></strong>
                  <small
                    th:text="${section.questionCount + ' câu · ' + section.durationMinutes + ' phút'}"
                  ></small>
                </span>
                <em
                  th:text="${section.state == 'OPEN' ? 'Đang làm' : (section.state == 'COMPLETED' ? 'Đã hết giờ' : 'Chưa mở')}"
                ></em>
              </div>
            </li>
          </ol>
        </nav>
        <dl class="exam-stats">
          <div>
            <dt>Tổng số câu</dt>
            <dd th:text="${attempt.totalItems()}"></dd>
          </div>
          <div>
            <dt>Đang làm</dt>
            <dd id="exam-current-question">—</dd>
          </div>
        </dl>
        <nav class="exam-question-navigation" aria-label="Danh sách câu hỏi">
          <span class="exam-progress-label" id="exam-progress-count">
            <strong th:text="${attempt.answeredItems()}">0</strong>
            /
            <span th:text="${attempt.totalItems()}">0</span>
            câu đã làm
          </span>
          <div class="exam-question-grid">
            <th:block th:each="question : ${attempt.questions}">
              <button
                th:each="item : ${question.items}"
                class="exam-question-link"
                type="button"
                th:text="${item.position}"
                th:classappend="${item.answered()} ? 'is-answered'"
                th:attr="data-item-id=${item.itemId},aria-label=${'Câu ' + item.position}"
              ></button>
            </th:block>
          </div>
        </nav>
        <div class="exam-control-actions">
          <form
            th:if="${attempt.nextSection()}"
            id="next-section-form"
            method="post"
            th:action="@{/student/attempts/{id}/next-section(id=${attempt.attemptId})}"
          >
            <input
              type="hidden"
              name="sectionEndMinute"
              th:value="${attempt.nextSectionAfterMinute}"
            />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button id="next-section" class="button" type="submit">Sang phần tiếp theo</button>
          </form>
          <form
            id="submit-attempt-form"
            method="post"
            th:action="@{/student/attempts/{id}/submit(id=${attempt.attemptId})}"
          >
            <p
              id="attempt-submit-error"
              class="alert alert-danger ap-alert ap-alert-danger"
              role="alert"
              tabindex="-1"
              hidden
            ></p>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button
              id="submit-attempt"
              class="button"
              th:classappend="${attempt.nextSection()} ? 'button-secondary'"
              type="submit"
            >
              Nộp bài
            </button>
          </form>
          <a
            id="exit-attempt"
            class="button button-secondary exam-exit-button"
            th:href="${attemptExitUrl}"
          >
            ← Thoát bài thi
          </a>
        </div>
      </aside>
      <main class="app-main student-content" id="main-content" tabindex="-1">
        <header class="page-header">
          <div>
            <h1 th:text="${attempt.title}"></h1>
          </div>
        </header>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
        <section
          class="dashboard-panel dashboard-section full-mock-question"
          th:each="question, questionStat : ${attempt.questions}"
          th:attr="data-question-page=${questionStat.index}"
        >
          <p
            class="eyebrow"
            th:text="${'Nhóm ' + questionStat.count + ' · ' + display.catalogSkill(question.skill)}"
          ></p>
          <h2 tabindex="-1" th:text="${question.content}"></h2>
          <p
            class="question-instruction"
            th:if="${question.skill == 'READING' and (question.instruction != null and !question.instruction.isBlank())}"
            th:text="${question.instruction}"
          ></p>
          <article
            class="reading-passage"
            th:if="${question.skill == 'READING' and (question.readingPassage != null and !question.readingPassage.isBlank())}"
          >
            <h3>Đoạn văn</h3>
            <div class="reading-passage-text" th:text="${question.readingPassage}"></div>
          </article>
          <div class="attempt-media" th:each="media : ${question.media}">
            <img
              th:if="${media.type == 'IMAGE'}"
              th:src="@{/student/attempts/{id}/media/{mediaId}/content(id=${attempt.attemptId},mediaId=${media.id})}"
              th:alt="${media.filename}"
            />
            <div th:if="${media.type == 'AUDIO'}" class="media-player">
              <div class="media-audio-shell">
                <button
                  class="media-play-trigger"
                  type="button"
                  aria-label="Phát bài nghe"
                ></button>
                <audio
                  class="media-audio"
                  controls
                  controlsList="nodownload noplaybackrate"
                  disablepictureinpicture
                  preload="metadata"
                  th:attr="data-play=@{/student/attempts/{id}/media/{mediaId}/play(id=${attempt.attemptId},mediaId=${media.id})},data-content=@{/student/attempts/{id}/media/{mediaId}/content(id=${attempt.attemptId},mediaId=${media.id})}"
                >
                  Trình duyệt không hỗ trợ phát audio.
                </audio>
              </div>
              <span class="media-status muted" aria-live="polite">
                Bấm phát trên thanh âm thanh để nghe.
              </span>
            </div>
          </div>
          <div
            th:each="item : ${question.items}"
            class="question-item"
            tabindex="-1"
            th:attr="data-saved=${item.audioSaved},data-item-id=${item.itemId}"
          >
            <div class="question-item-header">
              <span
                class="question-item-number"
                th:text="${item.position}"
                aria-hidden="true"
              ></span>
              <p class="question-item-prompt" th:text="${item.content}"></p>
            </div>
            <form
              class="answer-form"
              method="post"
              th:attr="data-autosave=@{/student/attempts/{id}/answers/autosave(id=${attempt.attemptId})}"
              th:action="@{/student/attempts/{id}/answers(id=${attempt.attemptId})}"
            >
              <input type="hidden" name="questionId" th:value="${question.questionId}" />
              <input type="hidden" name="itemId" th:value="${item.itemId}" />
              <div th:if="${question.type == 'ORDERING'}" class="field">
                <label th:for="${'position-' + (item.itemId)}">Vị trí trong thứ tự</label>
                <input
                  type="number"
                  min="1"
                  th:max="${question.items.size()}"
                  name="userPosition"
                  th:id="${'position-' + (item.itemId)}"
                  th:value="${item.userPosition}"
                />
              </div>
              <div
                th:if="${question.type != 'ORDERING' and (item.options != null and !item.options.isEmpty())}"
                class="catalog-checkbox"
              >
                <label th:each="option : ${item.options}">
                  <input
                    type="radio"
                    name="selectedOptionId"
                    th:value="${option.id}"
                    th:checked="${item.selectedOptionId == option.id}"
                  />
                  <span th:text="${option.code + ' · ' + option.content}"></span>
                </label>
              </div>
              <div class="field" th:if="${question.type == 'WRITING_TEXT'}">
                <label th:for="${'answer-' + (item.itemId)}">Câu trả lời</label>
                <textarea
                  th:id="${'answer-' + (item.itemId)}"
                  name="textAnswer"
                  rows="6"
                  th:text="${item.textAnswer}"
                ></textarea>
              </div>
              <span class="autosave-status muted" aria-live="polite"></span>
            </form>
            <form
              th:if="${question.type == 'SPEAKING_AUDIO'}"
              class="speaking-recorder"
              method="post"
              enctype="multipart/form-data"
              th:attr="data-audio-action=@{/student/attempts/{id}/answers/audio/autosave(id=${attempt.attemptId})},data-question-id=${question.questionId},data-item-id=${item.itemId},data-response-seconds=${item.responseSeconds}"
            >
              <span class="speaking-recorder-label">Câu trả lời của bạn</span>
              <div class="speaking-recorder-actions">
                <button class="button button-secondary recording-start" type="button">
                  Bắt đầu ghi
                </button>
                <button class="button button-secondary recording-stop" type="button" disabled>
                  Dừng ghi
                </button>
                <button class="button button-secondary recording-reset" type="button" disabled>
                  Ghi lại
                </button>
                <button class="button recording-save" type="button" disabled>Lưu bản ghi</button>
              </div>
              <span class="recording-status muted" aria-live="polite">Sẵn sàng ghi âm.</span>
              <div class="recording-meter">
                <div class="recording-meter-heading">
                  <span>Thời gian ghi âm</span>
                  <strong class="recording-time">00:00 / 00:45</strong>
                </div>
                <progress class="recording-progress" value="0" max="45"></progress>
              </div>
              <audio
                class="recording-preview is-empty"
                controls
                preload="metadata"
                aria-label="Nghe lại bản ghi"
                aria-hidden="true"
              ></audio>
              <span
                class="muted recording-saved"
                th:text="${item.audioSaved ? 'Đã lưu bản ghi.' : 'Chưa có bản ghi đã lưu.'}"
              ></span>
            </form>
          </div>
        </section>
        <nav
          class="full-mock-pagination"
          th:if="${(attempt.examType == 'FULL_MOCK' or (attempt.examType == 'PLACEMENT' and attempt.sectionSkill != null))}"
          aria-label="Điều hướng câu hỏi Full Mock"
        >
          <button id="full-mock-prev" class="button button-secondary" type="button">
            ← Nhóm trước
          </button>
          <span id="full-mock-page-info" class="full-mock-pagination-info">Nhóm 1 / 1</span>
          <button id="full-mock-next" class="button" type="button">Nhóm tiếp theo →</button>
        </nav>
      </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/exam-runner.js}" defer></script>
  </body>
</html>
