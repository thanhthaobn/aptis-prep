<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AptisPrep - Nền tảng luyện thi Aptis chuẩn CEFR (Reading, Listening, Writing, Speaking) với lộ trình cá nhân hóa và chấm điểm thông minh."
    />
    <title>Chứng chỉ | AptisPrep</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6E56'/%3E%3Cpath d='M16 6 L24 25 L19.5 25 L17.5 20 L14.5 20 L12.5 25 L8 25 Z M16 12 L15.2 17 L16.8 17 Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/learning-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/navi.css}" />
    <link rel="stylesheet" th:href="@{/css/exam.css}" />
    <link rel="stylesheet" th:href="@{/css/result.css}" />
    <link rel="stylesheet" th:href="@{/css/catalog-compact.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-overview.css}" />
    <link rel="stylesheet" th:href="@{/css/typography.css}" />
    <script th:src="@{/js/app-dialog.js}" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body class="admin-theme">
    <header th:replace="~{fragments/admin-layout :: adminHeader}"></header>
    <div class="container ap-container app-shell">
      <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('certificates')}"></aside>
      <main id="main-content" tabindex="-1" class="app-main admin-catalog admin-scoring-settings">
        <div class="messages-container" aria-live="polite">
          <div
            class="alert alert-success ap-alert ap-alert-success"
            role="status"
            th:if="${successMessage != null or (message != null and error == null)}"
            th:text="${successMessage != null ? successMessage : message}"
          ></div>
          <div
            class="alert alert-danger ap-alert ap-alert-danger"
            role="alert"
            th:if="${errorMessage != null or error != null}"
            th:text="${errorMessage != null ? errorMessage : error}"
          ></div>
          <div
            class="alert alert-warning ap-alert ap-alert-warning"
            role="alert"
            th:if="${warningMessage != null or warning != null}"
            th:text="${warningMessage != null ? warningMessage : warning}"
          ></div>
          <div
            class="alert alert-info ap-alert ap-alert-info"
            role="status"
            th:if="${infoMessage != null or info != null}"
            th:text="${infoMessage != null ? infoMessage : info}"
          ></div>
        </div>
        <header class="page-header"><h1>Chứng chỉ</h1></header>
        <section id="certificates">
          <div class="section-title-row">
            <h2>Chứng chỉ</h2>
            <a class="button" th:href="@{/admin/certificates/create}">Thêm chứng chỉ</a>
          </div>
          <div class="table-wrap" th:if="${certificatePage.hasContent()}">
            <table class="data-table admin-responsive-table">
              <thead>
                <tr>
                  <th scope="col">Tên chứng chỉ</th>
                  <th scope="col">Mã</th>
                  <th scope="col">Trạng thái</th>
                  <th scope="col">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="certificate : ${certificatePage.content}">
                  <td data-label="Tên chứng chỉ" th:text="${certificate.name}"></td>
                  <td data-label="Mã" th:text="${certificate.code}"></td>
                  <td data-label="Trạng thái">
                    <span
                      class="scoring-status"
                      th:classappend="${certificate.status == 'ACTIVE'} ? 'is-active'"
                      th:text="${certificate.statusLabel}"
                    ></span>
                  </td>
                  <td data-label="Thao tác">
                    <div class="catalog-table-actions">
                      <a th:href="@{/admin/certificates/{id}(id=${certificate.id})}">
                        Xem chi tiết
                      </a>
                      <a th:href="@{/admin/certificates/{id}/edit(id=${certificate.id})}">
                        Chỉnh sửa
                      </a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <th:block
            th:with="currentPage=${certificatePage.number}, totalPages=${certificatePage.totalPages}, totalItems=${certificatePage.totalElements}, baseUrl=@{/admin/certificates}, pageParam='certificatePage'"
          >
            <nav
              th:with="pageUrl=${baseUrl + (#strings.contains(baseUrl, '?') ? '&' : '?') + pageParam + '='}"
              class="pagination student-pagination"
              aria-label="Phân trang"
            >
              <span th:text="${'' + (totalItems) + ' kết quả'}">0 kết quả</span>
              <div class="pagination-pages" th:if="${totalPages > 1}">
                <a
                  class="page-link"
                  th:if="${currentPage > 0}"
                  th:href="${pageUrl + (currentPage - 1)}"
                  aria-label="Trang trước"
                >
                  ‹
                </a>
                <span
                  class="page-link disabled"
                  th:unless="${currentPage > 0}"
                  aria-disabled="true"
                  aria-label="Trang trước"
                >
                  ‹
                </span>
                <th:block
                  th:with="start=${currentPage > 2 ? currentPage - 2 : 0},end=${currentPage + 2 < totalPages ? currentPage + 2 : totalPages - 1}"
                >
                  <a
                    class="page-link"
                    th:if="${start > 0}"
                    th:href="${pageUrl + '0'}"
                    aria-label="Trang 1"
                  >
                    1
                  </a>
                  <span class="pagination-gap" th:if="${start > 1}" aria-hidden="true">…</span>
                  <th:block th:each="index : ${#numbers.sequence(start, end)}">
                    <span
                      class="page-link active"
                      th:if="${index == currentPage}"
                      aria-current="page"
                      th:attr="aria-label=${'Trang ' + (index + 1)}"
                      th:text="${index + 1}"
                    ></span>
                    <a
                      class="page-link"
                      th:unless="${index == currentPage}"
                      th:href="${pageUrl + index}"
                      th:attr="aria-label=${'Trang ' + (index + 1)}"
                      th:text="${index + 1}"
                    ></a>
                  </th:block>
                  <span class="pagination-gap" th:if="${end < totalPages - 2}" aria-hidden="true">
                    …
                  </span>
                  <a
                    class="page-link"
                    th:if="${end < totalPages - 1}"
                    th:href="${pageUrl + (totalPages - 1)}"
                    th:attr="aria-label=${'Trang ' + (totalPages)}"
                    th:text="${totalPages}"
                  ></a>
                </th:block>
                <a
                  class="page-link"
                  th:if="${currentPage + 1 < totalPages}"
                  th:href="${pageUrl + (currentPage + 1)}"
                  aria-label="Trang sau"
                >
                  ›
                </a>
                <span
                  class="page-link disabled"
                  th:unless="${currentPage + 1 < totalPages}"
                  aria-disabled="true"
                  aria-label="Trang sau"
                >
                  ›
                </span>
              </div>
              <span
                th:if="${totalPages > 1}"
                th:text="${'Trang ' + (currentPage + 1) + ' / ' + (totalPages)}"
              ></span>
            </nav>
          </th:block>
          <div class="empty-box" th:unless="${certificatePage.hasContent()}">
            <figure class="navi navi-empty">
              <svg viewBox="0 0 160 130" role="img" aria-label="Navi đang chờ chứng chỉ đầu tiên">
                <path
                  class="navi-shadow"
                  d="M36 118c0-8 21-14 46-14s46 6 46 14-21 10-46 10-46-2-46-10Z"
                ></path>
                <path
                  class="navi-body"
                  d="M43 68c0-29 17-48 40-48s42 19 42 48c0 32-13 48-42 48S43 100 43 68Z"
                ></path>
                <path class="navi-antenna" d="M82 21V9m0 0 9-5"></path>
                <circle class="navi-eye" cx="67" cy="63" r="5"></circle>
                <circle class="navi-eye" cx="99" cy="63" r="5"></circle>
                <path class="navi-mouth" d="M72 79c6 6 15 6 22 0"></path>
                <path class="navi-arm navi-arm-left" d="M46 73 25 61"></path>
                <path class="navi-arm navi-arm-right" d="m122 73 19-17"></path>
              </svg>
              <figcaption>Navi đang chờ chứng chỉ đầu tiên</figcaption>
            </figure>
            <p>Chưa có chứng chỉ.</p>
          </div>
        </section>
      </main>
    </div>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <span>© 2026 AptisPrep. Học đúng lộ trình, tiến bộ mỗi ngày.</span>
        <span>Nền tảng học tập và luyện thi Aptis</span>
      </div>
    </footer>
  </body>
</html>
