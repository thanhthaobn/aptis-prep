<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mục tiêu học tập')}"></head>
<body class="student-theme">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container app-shell">
    <div th:replace="~{fragments/student-sidebar :: studentSidebar('profile')}"></div>
    <main class="app-main student-content" id="main-content" tabindex="-1">
        <header class="page-header"><div><p class="eyebrow">MỤC TIÊU</p><h1>Mục tiêu học tập</h1><p>Chọn mục tiêu theo từng kỹ năng. Bạn có thể bỏ qua và khám phá bài học trước.</p></div></header>
        <div th:replace="~{fragments/messages :: messages}"></div>
        <form class="dashboard-panel" th:action="@{/student/goals}" th:object="${goalForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h2>Mục tiêu của bạn</h2>
            <div class="field"><label for="certificateId">Chứng chỉ</label><select id="certificateId" th:field="*{certificateId}"><option value="">Không chọn</option><option th:each="certificate : ${certificates}" th:value="${certificate.id}" th:text="|${certificate.name} (${certificate.code})|"></option></select></div>
            <div class="field"><label for="targetDate">Ngày mục tiêu</label><input id="targetDate" type="date" th:field="*{targetDate}"><p class="field-error" th:errors="*{targetDate}"></p></div>
            <div class="catalog-form-grid">
                <div class="field"><label for="grammarVocabulary">Grammar &amp; Vocabulary</label><select id="grammarVocabulary" th:field="*{grammarVocabulary}"><option value="">Chưa đặt</option><option th:each="level : ${ {'A1','A2','B1','B2','C1','C2'} }" th:value="${level}" th:text="${level}"></option></select></div>
                <div class="field"><label for="reading">Reading</label><select id="reading" th:field="*{reading}"><option value="">Chưa đặt</option><option th:each="level : ${ {'A1','A2','B1','B2','C1','C2'} }" th:value="${level}" th:text="${level}"></option></select></div>
                <div class="field"><label for="listening">Listening</label><select id="listening" th:field="*{listening}"><option value="">Chưa đặt</option><option th:each="level : ${ {'A1','A2','B1','B2','C1','C2'} }" th:value="${level}" th:text="${level}"></option></select></div>
                <div class="field"><label for="writing">Writing</label><select id="writing" th:field="*{writing}"><option value="">Chưa đặt</option><option th:each="level : ${ {'A1','A2','B1','B2','C1','C2'} }" th:value="${level}" th:text="${level}"></option></select></div>
                <div class="field"><label for="speaking">Speaking</label><select id="speaking" th:field="*{speaking}"><option value="">Chưa đặt</option><option th:each="level : ${ {'A1','A2','B1','B2','C1','C2'} }" th:value="${level}" th:text="${level}"></option></select></div>
            </div>
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
            <div class="actions"><button class="button" type="submit">Lưu mục tiêu</button><a class="button button-secondary" th:href="@{/student/learning-path}">Khám phá lộ trình</a></div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
