<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AptisPrep - Nền tảng luyện thi Aptis chuẩn CEFR (Reading, Listening, Writing, Speaking) với lộ trình cá nhân hóa và chấm điểm thông minh."
    />
    <title th:text="${setId==null?'Tạo bộ thẻ':'Chỉnh sửa bộ thẻ'} + ' | AptisPrep'">
      AptisPrep
    </title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6E56'/%3E%3Cpath d='M16 6 L24 25 L19.5 25 L17.5 20 L14.5 20 L12.5 25 L8 25 Z M16 12 L15.2 17 L16.8 17 Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="stylesheet" th:href="@{/css/learning-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/navi.css}" />
    <link rel="stylesheet" th:href="@{/css/exam.css}" />
    <link rel="stylesheet" th:href="@{/css/result.css}" />
    <link rel="stylesheet" th:href="@{/css/catalog-compact.css}" />
    <link rel="stylesheet" th:href="@{/css/admin-overview.css}" />
    <link rel="stylesheet" th:href="@{/css/typography.css}" />
    <script th:src="@{/js/app-dialog.js}" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body class="admin-theme flashcard-page">
    <header th:replace="~{fragments/admin-layout :: adminHeader}"></header>
    <div class="container ap-container app-shell">
      <div>
        <aside th:replace="~{fragments/admin-sidebar :: adminSidebar('flashcards')}"></aside>
      </div>
      <main class="app-main flashcard-editor" id="main-content" tabindex="-1">
        <a class="back-link" th:href="${'/admin/flashcards'}">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m14 6-6 6 6 6" />
          </svg>
          <span>Quay lại</span>
        </a>

        <header class="page-header">
          <div>
            <p class="eyebrow">THƯ VIỆN CHUNG</p>
            <h1 th:text="${setId==null?'Tạo bộ thẻ':'Chỉnh sửa bộ thẻ'}"></h1>
          </div>
        </header>
        <form
          id="set-editor"
          method="post"
          th:action="${setId==null?'/admin/flashcards':'/admin/flashcards/'+setId}"
          th:object="${form}"
        >
          <section class="dashboard-panel">
            <div
              class="alert alert-danger ap-alert ap-alert-danger"
              th:if="${!#fields.allErrors().isEmpty()}"
            >
              <span th:each="message, status : ${#fields.allErrors()}">
                <br th:if="${!status.first}" />
                <span th:text="${message}"></span>
              </span>
            </div>
            <div class="field">
              <label for="title">Tên bộ thẻ</label>
              <input
                id="title"
                th:field="*{title}"
                required
                maxlength="255"
                placeholder="Ví dụ: Daily routines"
              />
            </div>
            <div class="field">
              <label for="description">Mô tả</label>
              <textarea
                id="description"
                th:field="*{description}"
                maxlength="2000"
                rows="2"
              ></textarea>
            </div>
            <div class="field">
              <label for="lesson">Bài học sử dụng bộ thẻ</label>
              <select id="lesson" th:field="*{lessonId}" required>
                <option value="">Chọn bài học</option>
                <option
                  th:each="lesson : ${lessons}"
                  th:value="${lesson.id}"
                  th:attr="data-level=${lesson.cefrLevel}"
                  th:text="${'' + (lesson.skill) + ' · ' + (lesson.cefrLevel) + ' · ' + (lesson.title)}"
                ></option>
              </select>
              <small>Bộ thẻ sẽ xuất hiện trong đúng bài học này.</small>
            </div>
            <div class="catalog-form-grid">
              <div class="field">
                <label for="level">Cấp độ</label>
                <select id="level" th:field="*{cefrLevel}">
                  <option th:each="v : ${levels}" th:value="${v}" th:text="${v}"></option>
                </select>
              </div>
              <div class="field">
                <label for="status">Trạng thái</label>
                <select id="status" th:field="*{status}">
                  <option value="DRAFT">Bản nháp</option>
                  <option value="PUBLISHED">Đã công bố</option>
                  <option value="ARCHIVED">Lưu trữ</option>
                </select>
              </div>
            </div>
          </section>
          <details class="dashboard-panel dashboard-section bulk-import">
            <summary>Nhập nhanh nhiều thuật ngữ</summary>
            <div class="bulk-import-body">
              <label for="bulk">Mỗi dòng: thuật ngữ, phím Tab hoặc dấu |, rồi định nghĩa</label>
              <textarea
                id="bulk"
                rows="6"
                placeholder="get up | thức dậy&#10;have breakfast | ăn sáng"
              ></textarea>
              <button type="button" id="import-cards" class="button button-secondary">
                Thêm vào danh sách
              </button>
              <p id="import-message" role="status"></p>
            </div>
          </details>
          <div class="flashcard-editor-heading">
            <h2>Thuật ngữ</h2>
            <span id="card-count"></span>
          </div>
          <p id="editor-message" role="status" aria-live="polite"></p>
          <div id="card-rows">
            <div class="dashboard-panel card-editor-row" th:each="row, stat : *{rows}">
              <span class="card-number" th:text="${stat.count}"></span>
              <input
                type="hidden"
                data-name="id"
                th:name="${'rows[' + (stat.index) + '].id'}"
                th:value="${row.id}"
              />
              <div class="field">
                <label>Thuật ngữ</label>
                <textarea
                  data-name="term"
                  th:name="${'rows[' + (stat.index) + '].term'}"
                  th:text="${row.term}"
                  required
                  maxlength="200"
                  rows="2"
                ></textarea>
                <small class="char-count">0/200</small>
              </div>
              <div class="field">
                <label>Định nghĩa</label>
                <textarea
                  data-name="definition"
                  th:name="${'rows[' + (stat.index) + '].definition'}"
                  th:text="${row.definition}"
                  required
                  maxlength="1000"
                  rows="2"
                ></textarea>
                <small class="char-count">0/1000</small>
              </div>
              <button type="button" class="remove-card" aria-label="Xóa thẻ">×</button>
            </div>
          </div>
          <div class="actions editor-actions">
            <button type="button" id="undo-remove" class="button button-secondary" hidden>
              Hoàn tác
            </button>
            <button type="button" id="add-card" class="button button-secondary">+ Thêm thẻ</button>
            <button type="submit" class="button">Lưu bộ thẻ</button>
          </div>
        </form>
      </main>
    </div>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <span>© 2026 AptisPrep. Học đúng lộ trình, tiến bộ mỗi ngày.</span>
        <span>Nền tảng học tập và luyện thi Aptis</span>
      </div>
    </footer>
    <script th:src="@{/js/flashcard-editor.js}" defer></script>
  </body>
</html>
