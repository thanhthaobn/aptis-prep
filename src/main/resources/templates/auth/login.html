<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>
<body class="landing-theme">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="auth-page">
  <div class="container auth-layout">
    <section class="auth-welcome" aria-label="Chào mừng trở lại">
        <div th:replace="~{fragments/study-guide :: guide}"></div>
        <p class="eyebrow">MỖI NGÀY MỘT BƯỚC NHỎ</p>
        <h2>Hôm nay, mình cùng tiến bộ nhé!</h2>
        <p>Luyện Aptis theo nhịp của bạn.</p>
    </section>
    <div class="form-card">
        <span class="form-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"/></svg></span>
        <h1>Đăng nhập</h1>
        <p class="form-intro">Tiếp tục hành trình của bạn.</p>
        <div th:replace="~{fragments/messages :: messages}"></div>
        <div class="alert alert-danger" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
        <div class="alert alert-success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
            </div>
            <div class="field">
                <label for="password">Mật khẩu</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
            </div>
            <button class="button button-block" type="submit">Đăng nhập</button>
        </form>
        <p class="form-note">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
