<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Đổi mật khẩu')}"></head>
  <body class="landing-theme account-page">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main id="main-content" tabindex="-1" class="auth-page">
      <section class="form-card">
        <div
          th:replace="~{fragments/back-link :: backLink(${changing} ? @{/student/profile} : @{/forgot-password})}"
        ></div>
        <h1 th:text="${changing ? 'Đổi mật khẩu' : 'Đặt lại mật khẩu'}"></h1>
        <p>Sau khi đổi mật khẩu, bạn cần đăng nhập lại trên các thiết bị.</p>
        <form
          method="post"
          th:action="${changing} ? @{/student/password} : @{/reset-password}"
          th:object="${passwordForm}"
          data-account-form
        >
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" name="token" th:value="${token}" />
          <div
            role="alert"
            tabindex="-1"
            data-form-errors
            th:if="${!display.globalErrors('passwordForm').isEmpty()}"
          >
            <p
              class="field-error"
              th:each="message : ${display.globalErrors('passwordForm')}"
              th:text="${message}"
            ></p>
          </div>
          <div class="field" th:if="${changing}">
            <label for="currentPassword">Mật khẩu hiện tại</label>
            <input
              id="currentPassword"
              th:field="*{currentPassword}"
              type="password"
              autocomplete="current-password"
              required
              aria-describedby="currentPassword-error"
              th:attr="aria-invalid=${display.fieldInvalid('passwordForm', 'currentPassword')}"
            />
            <span class="field-error" id="currentPassword-error" aria-live="polite">
              <span th:errors="*{currentPassword}"></span>
            </span>
          </div>
          <div class="field">
            <label for="password">Mật khẩu mới</label>
            <small id="password-hint">Từ 8 ký tự, tránh mật khẩu dễ đoán.</small>
            <div class="password-input">
              <input
                id="password"
                th:field="*{password}"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                maxlength="72"
                data-password-policy
                aria-describedby="password-hint password-error"
                th:attr="aria-invalid=${display.fieldInvalid('passwordForm', 'password')}"
              />
              <button
                class="password-toggle"
                type="button"
                data-toggle-password="password"
                aria-controls="password"
                aria-pressed="false"
                aria-label="Hiện mật khẩu"
              >
                Hiện
              </button>
            </div>
            <span class="field-error" id="password-error" aria-live="polite">
              <span th:errors="*{password}"></span>
            </span>
          </div>
          <div class="field">
            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
            <input
              id="confirmPassword"
              th:field="*{confirmPassword}"
              type="password"
              autocomplete="new-password"
              required
              maxlength="72"
              data-password-confirm
              aria-describedby="confirmPassword-error"
              th:attr="aria-invalid=${display.fieldInvalid('passwordForm', 'confirmPassword')}"
            />
            <span class="field-error" id="confirmPassword-error" aria-live="polite">
              <span th:errors="*{confirmPassword}"></span>
            </span>
          </div>
          <button class="button" type="submit">Lưu mật khẩu mới</button>
        </form>
        <p></p>
      </section>
    </main>
    <script th:src="@{/js/account-forms.js}" defer></script>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
