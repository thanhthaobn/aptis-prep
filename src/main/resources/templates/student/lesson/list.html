<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Bài học')}"></head>
<body class="student-theme">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container app-shell">
    <div th:replace="~{fragments/student-sidebar :: studentSidebar('lessons')}"></div>
    <main class="app-main student-content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Tổng quan', @{/student/dashboard}, 'Bài học')}"></div>
        <header class="page-header"><div><p class="eyebrow">THƯ VIỆN HỌC TẬP</p><h1>Bài học theo kỹ năng</h1><p>Xem nội dung tổng quan và chọn đúng kỹ năng bạn muốn cải thiện.</p></div></header>
        <form class="toolbar" method="get" th:action="@{/student/lessons}">
            <div class="toolbar-search"><label for="q">Tìm kiếm</label><input id="q" name="q" th:value="${q}" maxlength="255" placeholder="Tên bài học hoặc chủ đề"></div>
            <div><label for="skill">Kỹ năng</label><select id="skill" name="skill"><option value="">Tất cả</option><option th:each="v:${skills}" th:value="${v}" th:text="${v}" th:selected="${selectedSkill==v}"></option></select></div>
            <div><label for="level">CEFR</label><select id="level" name="level"><option value="">Tất cả</option><option th:each="v:${levels}" th:value="${v}" th:text="${v}" th:selected="${selectedLevel==v}"></option></select></div>
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <section class="study-card-grid lesson-catalog-grid" th:if="${!#lists.isEmpty(lessons)}">
            <article class="dashboard-panel study-content-card lesson-catalog-card" th:each="lesson:${lessons}" th:attr="data-skill=${lesson.skill}">
                <div class="lesson-card-topline"><span class="lesson-skill-badge"><span class="lesson-skill-icon" aria-hidden="true"></span><span th:text="${lesson.skill}"></span></span><span class="lesson-level" th:text="|CEFR ${lesson.cefrLevel}|"></span></div>
                <div class="lesson-card-body">
                    <p class="lesson-topic" th:if="${lesson.material!=null and !#strings.isEmpty(lesson.material.topic)}" th:text="${lesson.material.topic}"></p>
                    <h2 th:text="${lesson.title}"></h2>
                    <p class="lesson-description" th:if="${!#strings.isEmpty(lesson.description)}" th:text="${lesson.description}"></p>
                    <p class="lesson-task-type" th:if="${lesson.material!=null and !#strings.isEmpty(lesson.material.taskType)}"><strong>Dạng bài:</strong> <span th:text="${lesson.material.taskType}"></span></p>
                </div>
                <a class="button button-secondary" th:href="@{/student/lessons/{id}(id=${lesson.id})}">Bắt đầu bài học →</a>
            </article>
        </section>
        <div class="empty-box" th:if="${#lists.isEmpty(lessons)}"><h2>Không tìm thấy bài học phù hợp</h2><p>Thử bộ lọc khác hoặc quay lại sau khi có nội dung mới.</p></div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
